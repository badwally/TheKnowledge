    sessions:
    - session_id: 2026-05-11-what-is-the-established-methodology-stack
      notebook_id: 9d5d27a3-17cc-4d75-8c63-ec2825b3d9bb
      query: "What is the established methodology stack for probabilistic component-level\
        \ capital forecasting in condominium / multi-unit residential reserve studies,\
        \ covering the six method families: (1) component-level degradation modeling\
        \ \u2014 Markov chain deterioration following Madanat/Golabi/Mishalani DOT\
        \ bridge and pavement work, Weibull and lognormal survival models, Bayesian\
        \ hierarchical degradation for sparse component data, physics-based corrosion\
        \ and fatigue models, hybrid physics-ML and PINN gray-box models, Gaussian\
        \ process regression for condition trajectories, Hidden Markov and state-space\
        \ models under partial observation; (2) time-to-failure and replacement timing\
        \ \u2014 hazard functions and competing risks, Cox proportional hazards and\
        \ accelerated failure time models with covariates, renewal processes for repeatedly-replaced\
        \ components, deep RUL methods (LSTM, transformer) and their data requirements\
        \ including negative-result reports; (3) cost and financial framing \u2014\
        \ ASTM E917 LCCA, ENR cost-escalation indices, autoregressive forecasts, regime-switching\
        \ for insurance shocks, real options for repair-vs-replace decisions; (4)\
        \ portfolio aggregation \u2014 Monte Carlo over component distributions to\
        \ fund-level cash flow, copulas and vine copulas for correlated failures and\
        \ cohort effects, stochastic optimization for replacement scheduling, Bayesian\
        \ decision theory for inspect-repair-replace; (5) data ingestion and updating\
        \ \u2014 sensor fusion (BAS, IoT, vibration, thermal), Bayesian updating with\
        \ inspection events, POMDP framing for inspection scheduling (Papakonstantinou\
        \ et al.), digital-twin standards NIST and ISO 23247, work-order and CMMS\
        \ history as covariates in survival models; (6) validation and calibration\
        \ \u2014 backtesting against realized expenditures, CRPS and PIT and reliability\
        \ diagrams for probabilistic forecast verification (Gneiting and Raftery),\
        \ out-of-sample testing under data scarcity. Prioritize survey papers, canonical\
        \ primary references (Madanat, Mishalani, Papakonstantinou, Gneiting), negative-result\
        \ studies where deep learning underperformed Weibull or Bayesian baselines\
        \ under sparse data, and validation-framework primaries. Deprioritize vendor\
        \ white papers and single-site deep-learning case studies without sample-size\
        \ or generalization detail."
      created_at: '2026-05-12T22:56:12Z'
      status: abandoned
      sources_count: 8
      promoted_at: null
