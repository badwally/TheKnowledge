    - session_id: 2026-05-20-risksystems-05-bounded-gamma-deterioration-kernel
      notebook_id: 8d8d68e1-b903-4c2a-b700-9e8bc6fe2b85
      query: "Risksystems Q5 \u2014 dedicated drilldown on the Bounded Gamma Process\
        \ (BGP)\ndeterioration kernel as a Longspan v3 candidate. Three explicit research\n\
        threads:\n\n(A) **Reference mathematical models.** What are the canonical\
        \ formulations\nof the gamma process for monotonic deterioration? Specifically:\
        \ the\nstationary gamma process (Abdel-Hameed 1975); the non-stationary /\n\
        time-transformed gamma process (van Noortwijk 2009 RESS review);\nhierarchical\
        \ Bayesian gamma processes with covariates (Pandey, Yuan,\nvan Noortwijk);\
        \ inverse Gaussian as a competing monotonic model;\nBounded Transformed Gamma\
        \ Process (BTGP) per arxiv-2508.13359 already\nin the corpus; Tweedie / generalized-gamma\
        \ extensions; and the\ninference machinery (MCMC, expectation-maximization,\
        \ Bayesian\nhierarchical fits) used to estimate parameters from sparse inspection\n\
        data. Want the full lineage: math, identifiability, prior structure,\nfailure-time\
        \ distribution derivations, censoring handling.\n\n(B) **SOTA ML implementations.**\
        \ How has BGP / gamma-process deterioration\nbeen implemented in modern ML\
        \ systems? At what scale (dataset size,\nproblem domain), with what results\
        \ (calibration metrics, predictive\naccuracy, value of information), and in\
        \ what problem areas? Specifically:\nbridge deck deterioration (Frangopol,\
        \ Pandey, Yuan); pavement (Madanat,\nMishalani); pipeline corrosion; nuclear-pressure-vessel\
        \ reliability\n(Bagdonavi\u010Dius, Nikulin); offshore-platform fatigue; aerospace\
        \ fatigue;\nbuilding infrastructure deterioration including roofing and concrete.\n\
        Include hybrid Gamma-PINN, neural-ODE-with-gamma-noise, Gaussian-\nprocess-conditioned\
        \ gamma, and any deep-learning-meets-monotonic-\nstochastic-process variants.\n\
        \n(C) **Corpus + labeling for Longspan six-component implementation.** What\n\
        is the minimum viable dataset (size, structure, labels) to fit a BGP\nfor\
        \ each of the six probabilistic components \u2014 roof, building envelope,\n\
        plumbing risers, HVAC central plant, elevators, parking deck / podium?\nSpecifically:\
        \ required time-series of condition observations (CAI 0-10\nrating, ASCE FCI,\
        \ RECI, or component-specific scales); inspection\ncadence assumptions (annual,\
        \ biennial); covariate set (effective age,\nmaterial class, climate exposure\
        \ \u2014 WDR / chloride / freeze-thaw,\njurisdiction, structure type); event-data\
        \ (replacements, major repairs)\nfor right-censoring; minimum n per component\
        \ class for defensible\nestimates; published benchmarks of dataset sizes that\
        \ produced\npublishable BGP fits in adjacent domains (bridges: HDM-4, Pontis,\n\
        AASHTO; water: KANEW, AWARE-P).\n\nFrame: Longspan v1.1 today fits Weibull\
        \ EUL distributions from the\n60-building BC concrete-frame highrise sample\
        \ (108-816 observations per\ncomponent class). The BGP would replace or augment\
        \ the Weibull with a\nfirst-principles monotonic stochastic kernel. The defensible\
        \ question\nis whether the existing sample sizes support BGP estimation, what\
        \ extra\ndata needs to be collected, and what the calibration / validation\n\
        cadence looks like. The output of this research thread feeds the v3\nengine-architecture\
        \ decision in Q3 2026.\n"
