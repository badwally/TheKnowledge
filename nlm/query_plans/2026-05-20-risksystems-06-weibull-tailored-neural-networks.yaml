prompt: |
  Risksystems Q6 — dedicated drilldown on Weibull-Tailored Neural Networks
  (WTNN) as a Longspan v3 candidate. Three explicit research threads:

  (A) **Reference mathematical lineage.** What is the canonical formulation
  of WTNN and the lineage that precedes it? Specifically: the classical
  Weibull accelerated-failure-time (AFT) model and Cox proportional-hazards
  model; the first wave of deep-survival architectures (DeepSurv per
  Katzman et al. 2018; DeepHit per Lee et al. 2018; RNN-Surv / Recurrent
  Neural Weibull / WTTE-RNN per Martinsson 2017); parametric vs
  non-parametric deep survival; the WTNN architecture per arxiv-2512.09163
  (Rives, Lopez, Bousquet) — how exactly are the Weibull shape (β) and
  scale (η) parameters constrained as functions of time-dependent
  covariates? what loss function (negative log-likelihood with censoring,
  Brier score, integrated Brier, concordance)? what monotonicity / shape
  constraints? how is qualitative prior knowledge about influential
  covariates baked into the architecture (input-feature gating, sign
  constraints, monotonic neural network layers, partial monotonic
  networks)? Identifiability under right-censoring; calibration; the
  audit story for a P.Eng. — can the trained network produce a
  human-readable explanation of why a coastal-exposed envelope
  component has its specific Weibull(β, η) fitted curve?

  (B) **SOTA ML implementations — scale + results + problem domain.** How
  have Weibull / deep-survival neural networks been implemented at scale
  in modern reliability and prognostics-and-health-management (PHM)
  systems? Specifically: wind-turbine fleet AFT (web-2026-05-01-6b7
  already in corpus, 8,000+ turbines / 64,000 operating years); NASA
  C-MAPSS turbofan remaining-useful-life benchmark (Saxena et al.) —
  what's the published n, RMSE, and architecture lineage for Weibull-
  conditioned deep models vs deterministic point estimates? Backblaze
  hard-drive survival; battery degradation neural Weibull;
  rolling-bearing PHM; healthcare clinical-survival benchmarks
  (SUPPORT, METABRIC, GBSG) and their architecture lessons. What's the
  minimum-viable n for a successfully published deep-survival fit —
  the Longspan analog to the diesel-cylinder-liner BGP benchmark
  (web-2022-07-07-ac2 fit on dozens of wear measures)? What are the
  failure modes — overfitting on small n, calibration drift,
  miscalibration of the variance of the predicted Weibull(β, η)?

  (C) **Corpus + labeling for Longspan six-component implementation.** What
  is the minimum viable dataset and covariate inventory to fit a WTNN
  for each of the six probabilistic components — roof, building
  envelope, plumbing risers, HVAC central plant, elevators, parking
  deck / podium? Specifically: required event-data (replacement /
  major repair as failure event, right-censored at last inspection);
  covariate inventory (effective age, material class, building-level
  per-face WDR / chloride / freeze-thaw cycles already computed for
  the Halifax pilot — see research/findings/0020 + the HRM polygon
  pipeline, jurisdiction, structure type, work-order frequency,
  ambient cycling load); cohort sample-size feasibility against the
  existing 60-building BC concrete-frame highrise sample (108-816
  obs per class) + the can-pilot 2,154-row multi-jurisdiction add;
  ablation of which of the six components is best served by WTNN vs
  the Phase-1 BGP kernel (parking deck / envelope / roof) vs the
  imperfect-repair RL framework. Critical question: which Phase-2
  components (HVAC central plant, elevators, plumbing risers) does
  WTNN unlock that BGP cannot, given their non-monotonic failure
  profiles and their richer covariate landscape (work-order frequency,
  fault codes, telemetry)?

  Frame: Longspan v1.1 today fits Weibull EUL distributions from the
  60-building BC concrete-frame highrise sample with a static engineer-
  to-data 1:1 blend. The cross-cutting Longspan-vs-SOA synthesis
  (~/code/knowledge/wiki/synthesis/2026-05-20-cross-cutting-comparison-longspan-v1-1.md)
  identified WTNN as the second v3 methodological moat (after BGP) —
  the framing is "we use AI, but our AI is strictly governed by
  reliability engineering physics." This drilldown is the dedicated
  evaluation: does WTNN unlock the Phase-2 mechanical components that
  BGP cannot handle, and what's the data-collection cost? Output
  feeds the v3 engine-architecture decision in Q3 2026. Audience:
  founder + technical co-founder + Mercer P.Eng. credibility
  credential. Render the math without Bayesian jargon — plain
  language.
