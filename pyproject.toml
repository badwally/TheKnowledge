[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-gateway"
version = "0.1.0"
description = "Gateway for the canonical knowledge base at ~/code/knowledge/"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "trafilatura>=1.10",
    "watchdog>=4.0",
    "mcp>=1.0",
    "youtube-transcript-api>=0.6",
    "pdfplumber>=0.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
whisper = [
    "mlx-whisper>=0.4",
    "pyannote.audio>=3.1",
    "mutagen>=1.47",
]

[project.scripts]
wiki = "gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
