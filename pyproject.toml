[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-gateway"
version = "0.1.0"
description = "Gateway for the canonical knowledge base at ~/code/knowledge/"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "trafilatura>=1.10",
    "watchdog>=4.0",
    "mcp>=1.0",
    "youtube-transcript-api>=0.6",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
whisper = [
    "mlx-whisper>=0.4",
    # pyannote.audio 3.x uses `pyannote/speaker-diarization-3.1` directly;
    # 4.x adds a `pyannote/speaker-diarization-community-1` indirection that
    # introduces an additional gated-model terms acceptance. Pin to 3.x for
    # a single gate.
    # huggingface_hub 1.x dropped the `use_auth_token` kwarg that pyannote 3.x
    # still passes through; torchaudio 2.5+ removed `AudioMetaData` that
    # pyannote 3.x imports. Pin both to compatible ranges.
    "pyannote.audio>=3.1,<4.0",
    "huggingface_hub<1.0",
    "torchaudio<2.5",
    "mutagen>=1.47",
]

[project.scripts]
wiki = "gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
