content_excerpt: Substance use disorders (SUDs) remain a major global health challenge
  with limited pharmacological treatment options and high relapse rates. Glucagon-like
  peptide-1 receptor agonists (GLP-1RAs), originally developed for type 2 diabetes
  and obesity, have recently gained attention for their potential effects on addictive
