content_excerpt: Glucagon-like peptide 1 (GLP-1), an incretin hormone that reduces
  food intake, was recently established as a novel regulator of alcohol-mediated behaviors.
  Clinically available analogues pass freely into the brain, but the mechanisms underlying
  GLP-1-modulated alcohol reward remains largely unclear. GLP-1 receptors (GLP-1R)
  are expressed throughout the nuclei of importance for acute and chronic effects
  of alcohol, such as the laterodorsal tegmental area (LDTg), the ventral tegmental
