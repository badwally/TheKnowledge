content_excerpt: 'Alcohol and drug dependence are major health and economic burdens
  to society. One of the major challenges to reducing this burden will be to develop
  more effective and better tolerated medications that target alternative mechanisms
  in the brain. While the dopamine system has been well characterized for mediating
  the reward value of drugs, there is evidence that the endocrine system also conveys
  signals to the same neural systems using gut hormones.


