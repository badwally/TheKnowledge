content_excerpt: Stress and low mood are powerful triggers for compulsive overeating,
  a maladaptive form of eating leading to negative physical and mental health consequences.
  Stress-vulnerable individuals, such as people with obesity, are particularly prone
  to overconsumption of high energy foods and may use it as a coping mechanism for
