content_excerpt: The Reward Prediction Error hypothesis proposes that phasic activity
  in the midbrain dopaminergic system reflects prediction errors needed for learning
  in reinforcement learning. Besides the well-documented association between dopamine
  and reward processing, dopamine is implicated in a variety of functions without
  a clear relationship to reward prediction error. Fluctuations in dopamine levels
  influence the subjective perception of time, dopamine bursts precede the generation
  of motor responses,
