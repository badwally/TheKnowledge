content_excerpt: 'Glucagon-like peptide-1 (GLP-1) receptor agonists are effective
  therapies for the treatment of type 2 diabetes and are all currently available as
  an injection.


  To compare the effects of oral semaglutide with placebo (primary) and open-label
  subcutaneous semaglutide (secondary) on glycemic control in patients with type 2
  diabetes.


  Phase 2, randomized, parallel-group, dosage-finding, 26-week trial with 5-week follow-up
