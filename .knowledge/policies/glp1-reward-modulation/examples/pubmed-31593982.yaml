content_excerpt: Compulsive eating characterizes many binge-related eating disorders,
  yet its neurobiological basis is poorly understood. The insular cortex subserves
  visceral-emotional functions, including taste processing, and is implicated in drug
  craving and relapse. Here, via optoinhibition, we implicate projections from the
  anterior insular cortex to the nucleus accumbens as modulating highly compulsive-like
  food self-administration behaviors that result from intermittent access to a palatable,
  high-sucros
