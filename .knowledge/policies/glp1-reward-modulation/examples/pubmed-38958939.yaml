content_excerpt: 'Anecdotal experience raised the possibility that semaglutide, a
  glucagon-like peptide 1 receptor agonist (GLP-1 RA) with rapidly increasing use,
  is associated with nonarteritic anterior ischemic optic neuropathy (NAION).


  To investigate whether there is an association between semaglutide and risk of NAION.


  In a retrospective matched cohort study using data from a centralized data registry
  of patients evaluated by neuro-ophthalmologists at 1 academic institution from December
  1, 2017, through No'
