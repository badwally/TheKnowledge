content_excerpt: We propose that dACC, AI and caudolateral OFC(clOFC) project to lateral
  habenula (LHb) and D2 loop of ventral striatum (VS), forming a functional adversity
  processing circuit, directed towards inhibitory avoidance and self-control. This
  circuit learns what is bad or harmful to us and predicts risks, to stop us from
  going/moving for bad or suboptimal choices that decrease our well-being and survival
  chances. Proposed dACC role is to generate a WARNING signal when things are going
