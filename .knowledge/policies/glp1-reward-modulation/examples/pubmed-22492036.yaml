content_excerpt: The glucagon-like peptide 1 (GLP-1) system is a recently established
  target for type 2 diabetes treatment. In addition to regulating glucose homeostasis,
  GLP-1 also reduces food intake. Previous studies demonstrate that the anorexigenic
  effects of GLP-1 can be mediated through hypothalamic and brainstem circuits which
  regulate homeostatic feeding. Here, we demonstrate an entirely novel neurobiological
  mechanism for GLP-1-induced anorexia in rats, involving direct effects of a GLP-1
  agonist, Exen
