content_excerpt: Nicotine use and nicotine use disorder (NUD) are the leading causes
  of preventable death in the United States. Persons with mental disorders  (e.g.,
  bipolar disorder) are differentially susceptible to nicotine use. Glucagon-like
  peptide-1 receptor agonists (GLP-1RAs) are indicated for type 2 diabetes mellitus
  (T2DM) and obesity and show preliminary evidence of efficacy in addiction-related
  behaviours. Herein, we synthesize extant preclinical and clinical evidence evaluating
  the effect of GLP-1RA
