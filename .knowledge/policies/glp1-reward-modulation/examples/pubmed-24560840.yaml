content_excerpt: Mesolimbic dopamine plays a critical role in food-related reward
  processing and learning. The literature focuses primarily on the nucleus accumbens
  as the key dopaminergic target in which enhanced dopamine signaling is associated
  with reward. Here, we demonstrate a novel neurobiological mechanism by which dopamine
  transmission in the amygdala regulates food intake and reward. We show that food
  intake was associated with increased dopamine turnover in the amygdala. Next, we
