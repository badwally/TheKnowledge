content_excerpt: 'Novo Nordisk has developed a subcutaneous formulation of semaglutide
  (Ozempic), a modified human glucagon-like peptide-1 (GLP-1) analogue, for the treatment
  of type 2 diabetes mellitus. It has been developed using Novo Nordisk''s proprietary
  protein-acylation technology, and is administered using an injection device. Semaglutide
  lowers blood glucose by stimulating the release of insulin and also lowers body
  weight. Once-weekly subcutaneous semaglutide has recently been approved in the US,
