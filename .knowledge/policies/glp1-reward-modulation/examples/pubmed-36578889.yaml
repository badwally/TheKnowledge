content_excerpt: 'The weight loss benefit of semaglutide in patients with diabetes
  is well-documented, but its clinical utility in treating obesity among patients
  without diabetes is less described. We therefore assessed the efficacy and safety
  of subcutaneous semaglutide as treatment for obesity in patients without diabetes.


  A comprehensive search of PubMed/MEDLINE, Cochrane and Google scholar was performed
  to identify trials on the efficacy and safety of subcutaneous semaglutide on patients
  with obesity withou'
