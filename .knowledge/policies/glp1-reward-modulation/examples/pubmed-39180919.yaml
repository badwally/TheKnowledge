content_excerpt: Heat stress is the most critical factor affecting animal feeding
  in summer. This experiment was conducted to investigate the effects of heat stress
  on the feeding preference of yellow-feathered broilers and its possible mechanism.
  As a result, the preference of yellow-feathered broilers for Tenebrio molitor was
  significantly decreased, and the fear response and serum corticosterone of broilers
  were significantly increased when the ambient temperatures are 35 °C (P < 0.05).
