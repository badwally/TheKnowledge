content_excerpt: Despite a broad range of pharmacological options for the treatment
  of type 2 diabetes, optimum glycaemic control remains challenging for many patients
  and new therapies are necessary. Semaglutide is a glucagon-like peptide-1 (GLP-1)
  analogue in phase 3 development for type 2 diabetes. We assessed the efficacy, safety,
  and tolerability of semaglutide monotherapy, compared with placebo, in treatment-naive
  patients with type 2 diabetes who had insufficient glycaemic control with diet and
