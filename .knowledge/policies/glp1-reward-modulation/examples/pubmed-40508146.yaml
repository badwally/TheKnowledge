content_excerpt: Glucagon-like peptide-1 receptor agonists, originally developed for
  the treatment of metabolic disorders, have recently emerged as promising candidates
  for the management of substance use disorders. This review synthesizes preclinical,
  clinical, and translational evidence on the effects of glucagon-like peptide-1 receptor
  agonists across addiction models involving alcohol, nicotine, psychostimulants,
  and opioids. In animal studies, glucagon-like peptide-1 receptor agonists consistently
