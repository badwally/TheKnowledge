content_excerpt: Unconditioned rewarding stimuli evoke phasic increases in dopamine
  concentration in the nucleus accumbens (NAc) while discrete aversive stimuli elicit
  pauses in dopamine neuron firing and reductions in NAc dopamine concentration. The
  unconditioned effects of more prolonged aversive states on dopamine release dynamics
  are not well understood and are investigated here using the malaise-inducing agent
  lithium chloride (LiCl). We used fast-scan cyclic voltammetry to measure phasic
