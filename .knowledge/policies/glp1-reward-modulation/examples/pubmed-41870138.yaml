content_excerpt: 'Glucagon-like peptide-1 receptor agonists (GLP-1 RAs) may influence
  reward-related and sexual behaviors.


  To synthesize evidence from preclinical and clinical studies evaluating the impact
  of GLP-1 RAs on libido and sexual function in both women and men.


  A structured synthesis of published studies examining GLP-1 RAs in relation to sexual
  behaviors, libido, and sexual parameters was performed using PubMed.


