content_excerpt: 'We conducted a systematic review and network meta-analysis to compare
  the efficacy and safety of s.c. administered tirzepatide vs s.c. administered semaglutide
  for adults of both sexes with type 2 diabetes mellitus.


  We searched PubMed and Cochrane up to 11 November 2023 for RCTs with an intervention
  duration of at least 12 weeks assessing s.c. tirzepatide at maintenance doses of
  5 mg, 10 mg or 15 mg once weekly, or s.c. semaglutide at maintenance doses of 0.5
  mg, 1.0 mg or 2.0 mg once weekly, i'
