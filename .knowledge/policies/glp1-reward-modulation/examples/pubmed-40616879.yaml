content_excerpt: Eating disorders (EDs), including anorexia nervosa (AN), bulimia
  nervosa (BN), and binge eating disorder (BED), frequently co-occur with substance
  use disorders (SUDs), affecting 20-30 % of individuals with either condition. This
  significant overlap is driven by shared neurobiological mechanisms, such as disruptions
  in dopamine, opioid, and cannabinoid systems, as well as by psychological traits
  including impulsivity, anxiety, and stress. While AN is often characterized by restrictive
