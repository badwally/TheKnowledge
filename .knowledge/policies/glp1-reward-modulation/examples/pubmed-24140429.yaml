content_excerpt: Glucagon-like peptide-1 (GLP-1), a hormone and neuropeptide, is known
  to regulate energy homeostasis in part through an established central role in controlling
  food intake. Historically this central role has largely been attributed to GLP-1
  receptor signaling in the brainstem and hypothalamus. However, emerging data indicate
  that GLP-1 also contributes to non-homeostatic regulation of food reward and motivated
  behaviors in brain reward centers, including the ventral tegmental area and nucleus
