content_excerpt: The use of Glucagon-like peptide-1 receptor agonists (GLP-1RAs) is
  an established therapy for type 2 diabetes (T2D) and obesity, providing effective
  glycemic control, weight loss, and cardiovascular and renal benefits. Evidence is
  emerging on the potential neuropsychiatric and neuroprotective effects mediated
  via central GLP-1R. This review summarizes preclinical, clinical, and real-world
  findings on the use of GLP-1R agonists in depression, anxiety, binge eating disorder
