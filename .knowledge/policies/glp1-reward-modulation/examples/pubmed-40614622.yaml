content_excerpt: 'To evaluate the association between tirzepatide and the risk of
  developing erectile dysfunction (ED) in men with type 2 diabetes (T2D), compared
  with sitagliptin, injectable semaglutide, and dulaglutide.


  This retrospective cohort study used the TriNetX global health research network
  from May 13, 2022 to May 17, 2025. Male patients aged 18-70 with T2D and no prior
  ED were included. Three 1:1 propensity score-matched comparisons were conducted:
  tirzepatide vs. sitagliptin, injectable semaglutide,'
