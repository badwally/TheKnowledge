content_excerpt: 'Doxorubicin is a powerful chemotherapeutic agent for cancer, whose
  use is limited due to its potential cardiotoxicity. Semaglutide (SEMA), a novel
  analog of glucagon-like peptide-1 (GLP-1), has received widespread attention for
  the treatment of diabetes. However, increasing evidence has highlighted its potential
  therapeutic benefits on cardiac function. Therefore, the objective of this study
  was to examine the efficacy of semaglutide in ameliorating doxorubicin-induced cardiotoxicity.


  Doxorubic'
