content_excerpt: 'Glucagon-like peptide-1 receptor agonists (GLP-1RAs) have emerged
  as an efficacious treatment for type 2 diabetes mellitus (T2DM) and have demonstrated
  substantial weight loss effects. This systematic review compares two prevalent GLP-1RAs,
  tirzepatide and semaglutide, with their weight loss effects and rates of adverse
  events (AEs).


  Following the Preferred Reporting Items for Systematic Reviews and Meta-Analyses
  (PRISMA), a systematic search was performed in PubMed, Embase and Cochrane Library'
