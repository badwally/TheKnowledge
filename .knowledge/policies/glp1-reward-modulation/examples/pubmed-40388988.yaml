content_excerpt: 'The rapid rise in ultra-processed foods (UPF) consumption correlates
  with the growing global obesity prevalence. Investigating the hedonic and homeostatic
  mechanisms affected by UPF may provide insights for obesity prevention and appetite
  regulation. This systematic review aimed to examine the current understanding of
  the potential effects of UPF on appetite regulation and food intake, examining both
  hedonic and homeostatic pathways. A search was performed in PubMed, Scopus, Web
