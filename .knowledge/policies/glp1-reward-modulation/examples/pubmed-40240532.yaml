content_excerpt: Glucagon-like peptide-1 (GLP-1) receptor agonists, widely prescribed
  for type 2 diabetes and weight management, are known for their metabolic benefits
  but may have unrecognized side effects. This study investigates the association
  between GLP-1 receptor agonists and male sexual dysfunction using data from the
  FDA Adverse Event Reporting System (FAERS). Reports from Q4 2003 to Q1 2024 were
  analyzed using the OpenVigil 2.1 platform to identify male patients experiencing
  orgasmic dysfunction, erect
