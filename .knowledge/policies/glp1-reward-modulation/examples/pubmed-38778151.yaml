content_excerpt: Semaglutide was approved in June 2021 for weight loss in non-diabetic,
  obese patients. While package inserts include sexual dysfunction as a side effect,
  no study has assessed the degree of this risk. The objective of our study is to
  assess the risk of developing erectile dysfunction after semaglutide is prescribed
  for weight loss in obese, non-diabetic men. The TriNetX Research database was used
  to identify men without a diagnosis of diabetes ages 18 to 50 with BMI > 30 who
  were prescribed sema
