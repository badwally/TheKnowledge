content_excerpt: Erectile dysfunction (ED) is a common yet frequently underrecognized
  microvascular complication of diabetes, affecting up to three out of four individuals.
  Key contributing factors include advancing age, long-standing disease duration,
  and suboptimal glycemic control, as well as insulin resistance and androgen deficiency-the
  latter being particularly common in men with type 2 diabetes (T2D) and obesity.
