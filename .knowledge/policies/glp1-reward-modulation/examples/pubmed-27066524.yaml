content_excerpt: Natural rewards, including food, water, sleep and social interactions,
  are required to sustain life. The neural substrates that regulate the reinforcing
  effects of these behaviors are also the same neurobiological mechanisms mediating
  mood, motivation and the rewarding effects of pharmacological stimuli. That the
  neuropeptide glucagon-like peptide-1 (GLP-1) is under investigation for both the
  homeostatic and hedonic controls of feeding is not surprising or novel. However,
