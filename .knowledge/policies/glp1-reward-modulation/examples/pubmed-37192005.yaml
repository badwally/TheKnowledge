content_excerpt: Growing evidence indicates that the glucagon-like peptide-1 (GLP-1)
  system is involved in the neurobiology of addictive behaviors, and GLP-1 analogues
  may be used for the treatment of alcohol use disorder (AUD). Here, we examined the
  effects of semaglutide, a long-acting GLP-1 analogue, on biobehavioral correlates
  of alcohol use in rodents. A drinking-in-the-dark procedure was used to test the
  effects of semaglutide on binge-like drinking in male and female mice. We also tested
