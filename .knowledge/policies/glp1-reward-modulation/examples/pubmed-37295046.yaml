content_excerpt: 'Glucagon-like peptide1 receptor (GLP-1R) agonists have been found
  to reduce alcohol drinking in rodents and overweight patients with alcohol use disorder
  (AUD). However, the probability of low semaglutide doses, an agonist with higher
  potency and affinity for GLP-1R, to attenuate alcohol-related responses in rodents
  and the underlying neuronal mechanisms is unknown.


  In the intermittent access model, we examined the ability of semaglutide to decrease
  alcohol intake and block relapse-like drinkin'
