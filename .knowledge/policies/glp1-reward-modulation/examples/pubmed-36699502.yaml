  and mortality. Given the heterogenicity of this brain disease, available pharmacological
  treatments only display efficacy in sub-set of individuals. The need for additional
  treatment options is thus substantial and is the goal of preclinical studies unraveling
  neurobiological mechanisms underlying AUD. Although these neurobiological processes
