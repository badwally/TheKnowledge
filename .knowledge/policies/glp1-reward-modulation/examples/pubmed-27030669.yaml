content_excerpt: Glucagon-like peptide-1 (GLP-1) is currently one of the most promising
  biological systems for the development of effective obesity pharmacotherapies. Long-acting
  GLP-1 analogs potently reduce food intake and body weight, and recent discoveries
  reveal that peripheral administration of these drugs reduces food intake largely
  through humoral pathways involving direct action on brain GLP-1 receptors (GLP-1R).
  Thus, it is of critical importance to understand the neural systems through which
