content_excerpt: Glucagon-like peptide-1 (GLP-1) and glucose-dependent insulinotropic
  polypeptide (GIP) receptor agonists (RAs) mimic naturally occurring GLP-1 and GIP
  and are highly effective anti-diabetic and anti-obesity agents. In addition to their
  robust acute and long-term effects on weight, metabolism, and blood pressure, these
  agents also reduce cardiovascular mortality as well as stroke risk and associated
