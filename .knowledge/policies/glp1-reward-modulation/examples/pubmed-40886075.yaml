content_excerpt: 'Heart failure with preserved ejection fraction (HFpEF) is a major
  cause of hospitalization, often occurring in patients with cardiometabolic comorbidities
  such as obesity and type 2 diabetes. Although early trials of semaglutide and tirzepatide
  have shown promising results in improving symptoms, those findings were based on
  few clinical events, leaving treatment recommendations uncertain.


  To evaluate the effectiveness and safety of semaglutide and tirzepatide in patients
  with cardiometabolic HF'
