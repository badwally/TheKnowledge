content_excerpt: The gastrointestinal peptide glucagon-like peptide 1 (GLP-1) is known
  to regulate consummatory behavior and is released in response to nutrient ingestion.
  Analogues of this peptide recently emerged as novel pharmacotherapies for treatment
  of type II diabetes since they reduce gastric emptying, glucagon secretion as well
  as enhance glucose-dependent insulin secretion. The findings that GLP-1 targets
  reward related areas including mesolimbic dopamine areas indicate that the physiological
