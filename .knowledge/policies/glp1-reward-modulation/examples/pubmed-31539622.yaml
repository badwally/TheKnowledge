content_excerpt: 'SUSTAIN 10 compared the efficacy and safety of the anticipated most
  frequent semaglutide dose (1.0mg) with the current most frequently prescribed liraglutide
  dose in Europe (1.2mg), reflecting clinical practice.


  In this phase 3b, open-label trial, 577 adults with type 2 diabetes (HbA7.0-11.0%)
  on 1-3 oral antidiabetic drugs were randomized 1:1 to subcutaneous once-weekly semaglutide
