content_excerpt: 'Glucagon-like peptide-1 receptor (GLP-1R) agonists (GLP-1RA) and
  fibroblast growth factor-21 (FGF21) confer similar metabolic benefits. GLP-1RA induce
  FGF21, leading us to investigate mechanisms engaged by the GLP-1RA liraglutide to
  increase FGF21 levels and the metabolic relevance of liraglutide-induced FGF21.


  Circulating FGF21 levels were measured in fasted male C57BL/6J, neuronal GLP-1R
  knockout, β-cell GLP-1R knockout, and liver peroxisome proliferator-activated receptor
  alpha knockout mice'
