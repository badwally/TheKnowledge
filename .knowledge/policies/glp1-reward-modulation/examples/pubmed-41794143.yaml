content_excerpt: Sugar addiction has been proposed as a behavioural syndrome characterised
  by craving, loss of control, escalation of intake, and continued use despite adverse
  consequences. Although not formally recognised in current diagnostic systems, converging
  evidence suggests that addictive-like responding is most plausible for refined,
  rapidly delivered sugar vehicles (e.g., sugar-sweetened beverages) in vulnerable
  individuals, and overlaps substantially with loss-of-control eating presentations,
