content_excerpt: Dysfunctional signaling in midbrain reward circuits perpetuates diseases
  characterized by compulsive overconsumption of rewarding substances such as substance
  abuse, binge eating disorder, and obesity. Ventral tegmental area (VTA) dopaminergic
  activity serves as an index for how rewarding stimuli are perceived and triggers
  behaviors necessary to obtain future rewards. The evolutionary linking of reward
