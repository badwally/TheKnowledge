content_excerpt: Glucagon-like peptide-1 receptor (GLP-1R) agonists promote nicotine
  avoidance. Here, we show that the crosstalk between GLP-1 and nicotine extends beyond
  effects on nicotine self-administration and can be exploited pharmacologically to
  amplify the anti-obesity effects of both signals. Accordingly, combined treatment
  with nicotine and the GLP-1R agonist, liraglutide, inhibits food intake and increases
  energy expenditure to lower body weight in obese mice. Co-treatment with nicotine
  and liraglutid
