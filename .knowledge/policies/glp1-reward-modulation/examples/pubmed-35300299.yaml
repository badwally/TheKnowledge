content_excerpt: Cocaine use disorder (CUD) is a major public health challenge with
  a high relapse rate and lack of effective pharmacotherapies; therefore, there is
  a substantial need to identify novel medications to treat this epidemic. Since the
  advent of glucagon-like peptide-1 (GLP-1) receptors (GLP-1Rs) agonists (GLP-1RAs),
  their potential has been extensively explored and expanded. In this review, we first
  summarized the biological effects of GLP-1, GLP-1Rs, and GLP-1RAs. Subsequently,
