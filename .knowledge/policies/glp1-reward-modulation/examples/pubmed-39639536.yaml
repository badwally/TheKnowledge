content_excerpt: Combining different pharmaceuticals may be beneficial when treating
  disorders with complex neurobiology, including alcohol use disorder (AUD). The gut-brain
  peptides amylin and GLP-1 may be of potential interest as they individually reduce
  alcohol intake in rodents. While the combination of amylin receptor (AMYR) and glucagon-like
  peptide-1 receptor (GLP-1R) agonists have been found to decrease feeding and body
  weight in obese male rats synergistically, their combined impact on alcohol intake
