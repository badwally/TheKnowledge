content_excerpt: Addiction is a chronic relapsing disease with high morbidity and
  mortality. Treatments for addiction include pharmacological and psychosocial interventions;
  however, currently available medications are limited in number and efficacy. The
  glucagon-like-peptide-1 (GLP-1) system is emerging as a potential novel pharmacotherapeutic
  target for alcohol and other substance use disorders (ASUDs). In this review, we
  summarize and discuss the wealth of available evidence from testing GLP-1 receptor
