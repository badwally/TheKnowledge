content_excerpt: 'Semaglutide 2·4 mg once weekly has been investigated for weight
  management in global populations. Differences exist between Asian and non-Asian
  populations in terms of body composition and definitions of obesity. In the Semaglutide
  Treatment Effect in People with obesity (STEP) 6 trial, we assessed the effect of
  semaglutide versus placebo for weight management in adults from east Asia with obesity,
  with or without type 2 diabetes.


  This randomised, double-blind, double-dummy, placebo-controlled,'
