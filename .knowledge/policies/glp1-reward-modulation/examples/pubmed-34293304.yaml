content_excerpt: 'Semaglutide is an effective treatment for type 2 diabetes; however,
  20-30% of patients given semaglutide 1·0 mg do not reach glycaemic treatment goals.
  We aimed to investigate the efficacy and safety of once-weekly semaglutide 2·0 mg
  versus 1·0 mg in adults with inadequately controlled type 2 diabetes on a stable
  dose of metformin with or without a sulfonylurea.


  We did a 40-week, randomised, active-controlled, parallel-group, double-blind, phase
  3B trial (SUSTAIN FORTE) at 125 outpatient clinic'
