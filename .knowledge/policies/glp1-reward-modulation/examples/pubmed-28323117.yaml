content_excerpt: Semaglutide is a human glucagon-like peptide-1 analogue in clinical
  development for the treatment of type 2 diabetes. The absorption, metabolism and
  excretion of a single 0.5mg/450μCi [16.7MBq] subcutaneous dose of [H]-radiolabelled
  semaglutide was investigated in healthy human subjects and compared with data from
  nonclinical studies. Radioactivity in blood, plasma, urine and faeces was determined
  in humans, rats and monkeys; radioactivity in expired air was determined in humans
  and rats. Metabo
