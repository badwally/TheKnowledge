content_excerpt: Despite the benefits of early and effective glycemic control in the
  management of type 2 diabetes (T2D), achieving glycated hemoglobin (HbA) targets
  is challenging in some patients. Glucagon-like peptide-1 receptor agonists (GLP-1RAs)
  provide effective reductions in HbAand body weight. Semaglutide is the only GLP-1RA
  that is available in both an injectable and oral formulation. The efficacy of once-weekly
  subcutaneous semaglutide and once-daily oral semaglutide has been investigated in
