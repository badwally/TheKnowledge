content_excerpt: Alcohol use disorder (AUD) is a complex psychiatric condition with
  limited effective treatment options. Glucagon-like peptide-1 receptor (GLP-1R) agonists
  have emerged as potential AUD treatment, as they have been shown to modulate reward-related
  behaviours, including those linked to alcohol consumption. However, the underlying
  mechanisms and neurocircuitry remain unclear. This study investigated the role of
