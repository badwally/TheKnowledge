content_excerpt: Understanding the role of dentate gyrus (DG) mossy cells (MCs) in
  learning and memory has rapidly evolved due to increasingly precise methods for
  targeting MCs and for in vivo recording and activity manipulation in rodents. These
  studies have shown MCs are highly active in vivo, strongly remap to contextual manipulation,
  and that their inhibition or hyperactivation impairs pattern separation and location
  or context discrimination. Less well understood is how MC activity is modulated
  by neurohorm
