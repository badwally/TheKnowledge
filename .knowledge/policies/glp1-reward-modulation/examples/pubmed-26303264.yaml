content_excerpt: The incretin hormone, glucagon-like peptide 1 (GLP-1), regulates
  gastric emptying, glucose-dependent stimulation of insulin secretion and glucagon
  release, and GLP-1 analogs are therefore approved for treatment of type II diabetes.
  GLP-1 receptors are expressed in reward-related areas such as the ventral tegmental
  area and nucleus accumbens, and GLP-1 was recently shown to regulate several alcohol-mediated
  behaviors as well as amphetamine-induced, cocaine-induced and nicotine-induced reward.
