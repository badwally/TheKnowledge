content_excerpt: Obesity is a growing epidemic within the USA. Because weight gain
  is associated with an increased risk of developing life-threatening comorbidities,
  such as hypertension or type 2 diabetes, there is great interest in developing non-invasive
  pharmacotherapeutics to help combat obesity. Glucagon-like peptide-1 (GLP-1) receptor
  agonists are a class of antidiabetic medications that have shown promise in encouraging
