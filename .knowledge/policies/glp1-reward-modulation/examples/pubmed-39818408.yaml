content_excerpt: 'Obesity is an increasing public health problem because of its high
  prevalence and associated morbidity and mortality. Two weight-loss strategies are
  currently used, either bariatric surgery or pharmacological therapy with glucagon-like
  peptide-1 receptor agonists (GLP-1RAs). Preclinical studies in rodents suggested
  an increased risk of additive disorders after bariatric surgery contrasting with
  a reduced risk with GLP-1RAs.


