content_excerpt: Glucagon-like peptide 1 (GLP-1) analogues are used for the treatment
  of type 2 diabetes. The ability of the GLP-1 system to decrease food intake in rodents
  has been well described and parallels results from clinical trials. GLP-1 receptors
  are expressed in the brain, including within the ventral tegmental area (VTA) and
  the nucleus accumbens (NAc). Dopaminergic neurons in the VTA project to the NAc,
  and these neurons play a pivotal role in the rewarding effects of drugs of abuse.
