content_excerpt: 'Emerging preclinical evidence suggests that semaglutide, a glucagon-like
  peptide receptor agonist (GLP-1RA) for type 2 diabetes mellitus (T2DM) and obesity,
  protects against neurodegeneration and neuroinflammation. However, real-world evidence
  for its ability to protect against Alzheimer''s disease (AD) is lacking.


  We conducted emulation target trials based on a nationwide database of electronic
