content_excerpt: The neurochemical mechanisms that regulate development of alcohol
  use disorder (AUD) are complex, and gut-brain peptides were recently pinpointed
  as novel modulators. Gut-brain peptides, such as glucagon-like peptide-1 (GLP-1),
  are well known for their ability to regulate food intake and appetite. GLP-1 also
  controls glucose homeostasis, which lead to the approval of GLP-1 receptor agonists
  for treatment of diabetes type II. These pharmacotherapies, including exenatide/exendin-4(Ex4)
  and liraglu
