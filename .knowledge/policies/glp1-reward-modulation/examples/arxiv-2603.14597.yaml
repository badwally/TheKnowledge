content_excerpt: Autonomous LLM agents require structured long-term memory, yet current
  "append-and-evolve" systems like A-MEM face O(N^2) write-latency and excessive token
  costs. We introduce D-MEM (Dopamine-Gated Agentic Memory), a biologically inspired
  architecture that decouples short-term interaction from cognitive restructuring
  via a Fast/Slow routing system based on Reward Prediction Error (RPE). A lightweight
  Critic Router evaluates stimuli for Surprise and Utility. Routine, low-RPE inputs
