content_excerpt: For more than three decades, the Global Burden of Diseases, Injuries,
  and Risk Factors Study (GBD) has provided a framework to quantify health loss due
  to diseases, injuries, and associated risk factors. This paper presents GBD 2023
  findings on disease and injury burden and risk-attributable health loss, offering
  a global audit of the state of world health to inform public health priorities.
