content_excerpt: Central glucagon-like-peptide-1 (GLP-1) receptor activation reduces
  food intake; however, brain nuclei and mechanism(s) mediating this effect remain
  poorly understood. Although central nervous system GLP-1 is produced almost exclusively
  in the nucleus of the solitary tract in the hindbrain, GLP-1 receptors (GLP-1R)
  are expressed throughout the brain, including nuclei in the mesolimbic reward system
  (MRS), e.g. the ventral tegmental area (VTA) and the nucleus accumbens (NAc). Here,
