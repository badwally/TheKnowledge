content_excerpt: Ever since its discovery, glucagon-like-peptide 1 (GLP-1) and drugs
  with similar function (collectively GLP-1s) have been used for type 2 diabetes mellitus
  and have been effective for obesity. Their profound effect on weight loss has resulted
  in widespread use of these medicines for treating obesity. Extensive studies have
  shown that GLP-1s decrease body weight, lean mass, and other metabolic phenotypes.
