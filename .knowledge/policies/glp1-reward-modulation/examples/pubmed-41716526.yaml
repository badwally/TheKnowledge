content_excerpt: 'Glucagon-like-peptide-1 receptor agonists (GLP-1-RA) are increasingly
  prescribed medications with well-documented gastrointestinal adverse effects. Urologic
  adverse effects remain poorly characterized.


  A 40-year-old male developed reproducible urinary frequency, penile pruritus, dysuria,
  pelvic/perineal pain, and sexual dysfunction 3-4 weeks after initiating tirzepatide
  therapy. Comprehensive infectious evaluation remained negative. Symptoms improved
