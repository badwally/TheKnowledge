content_excerpt: Repeated administration of the long-acting glucagon-like peptide
  1 receptor agonist exendin-4 (EX-4) has been shown to reduce food intake and body
  weight and do so without a rebound increase in food intake after treatment termination.
  The current study examines the neural mechanisms underlying these actions. After
  6 weeks of maintenance on a standard chow or a high-fat (HF) diet, male Sprague
  Dawley rats were treated with EX-4 (3.2 μg/kg, i.p., twice a day) or vehicle for
  9 consecutive days. Foo
