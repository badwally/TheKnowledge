content_excerpt: The aim of this retrospective observational study was to evaluate
  whether adding liraglutide to lifestyle changes, metformin (Met) and testosterone
  replacement therapy (TRT), by means of improving weight and glycaemic control, could
  boost erectile function in type 2 diabetic obese men with overt hypogonadism and
  erectile dysfunction (ED) in a 'real-life setting'. Forty-three obese, diabetic
  and hypogonadal men (aged 45-59 years) were evaluated because of complaining about
  the recent onset of ED.
