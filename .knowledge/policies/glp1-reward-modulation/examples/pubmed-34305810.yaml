content_excerpt: The glucagon-like peptide-1 receptor agonist (GLP-1RA) semaglutide
  is the most recently approved agent of this drug class, and the only GLP-1RA currently
  available as both subcutaneous and oral formulation. While GLP-1RAs effectively
  improve glycemic control and cause weight loss, potential safety concerns have arisen
  over the years. For semaglutide, such concerns have been addressed in the extensive
  phase 3 registration trials including cardiovascular outcome trials for both subcutaneous
