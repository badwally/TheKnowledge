content_excerpt: Besides reducing food intake and controlling energy balance, glucagon-like
  peptide-1 (GLP-1) suppresses the reinforcing properties of palatable foods and addictive
  drugs. This reduction in reward involves activation of GLP-1 receptors (GLP-1R)
  within areas processing natural and artificial rewards, including the laterodorsal
  tegmental area (LDTg), ventral tegmental area (VTA) and nucleus accumbens (NAc)
  shell. These areas are part of a neurocircuitry mediating reward from addictive
