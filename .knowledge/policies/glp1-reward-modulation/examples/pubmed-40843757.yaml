content_excerpt: Substance use disorders (SUDs) remain a major public health challenge,
  with existing pharmacotherapies offering limited long-term efficacy. Traditional
  treatments focus on dopaminergic systems but often overlook the complex interplay
  between metabolic signals, neuroplasticity, and conditioned behaviors that perpetuate
  addiction. Glucagon-like peptide-1 receptor agonists (GLP-1RAs), originally developed
  for type 2 diabetes and obesity, have recently emerged as promising modulators of
