content_excerpt: 'To investigate the effects of once-weekly subcutaneous (s.c.) semaglutide
  2.4 mg on gastric emptying, appetite, and energy intake in adults with obesity.


  A double-blind, parallel-group trial was conducted in 72 adults with obesity, randomized
  to once-weekly s.c. semaglutide (dose-escalated to 2.4 mg) or placebo for 20 weeks.
  Gastric emptying was assessed using paracetamol absorption following a standardized
  breakfast. Participant-reported appetite ratings and Control of Eating Questionnaire
