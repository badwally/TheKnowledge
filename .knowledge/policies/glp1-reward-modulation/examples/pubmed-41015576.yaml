content_excerpt: Investigating similarities and differences between alcohol use disorder
  (AUD) and obesity is important because both AUD and obesity are public health concerns
  and share neurobiological and periphery-brain mechanisms. Furthermore, AUD and obesity
  often present with similar medical consequences related to organ damage, including
  liver and cardiovascular diseases. There is also growing evidence of changes in
