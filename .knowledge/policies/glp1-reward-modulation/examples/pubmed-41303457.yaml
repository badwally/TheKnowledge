content_excerpt: Binge eating disorder (BED) is a prevalent eating disorder lacking
  adequate pharmacological interventions. This review examines the therapeutic potential
  of glucagon-like peptide-1 receptor agonists (GLP-1RAs), medications approved for
  type 2 diabetes and obesity now being investigated for eating disorders through
  their modulation of metabolic and reward pathways. A narrative review was conducted
  using PubMed/MEDLINE, through May 2025, to examine GLP-1RA effects on BED, including
