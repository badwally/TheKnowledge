content_excerpt: 'Sexual dysfunction (SD) is a frequent and underrecognized complication
  of obesity, mediated by a complex interplay of hormonal, vascular, metabolic, and
  psychosocial pathways. Despite the established link between weight reduction and
  improved sexual health, the specific effects of new pharmacological weight-loss
  therapies on sexual function remain underexplored.


  To critically evaluate the recent evidence on the impact of weight-loss medications
  on sexual function, synthesizing clinical outcomes'
