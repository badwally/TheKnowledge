content_excerpt: Although the multifaceted mechanisms underlying alcohol use disorder
  (AUD) have been partially defined, the neurobiological complexity of this disorder
  is yet to be unraveled. One of the systems that have gained attention in recent
  times is the gut-brain axis. Although numerous peptides participate in this axis,
  glucagon-like peptide-1 (GLP-1) plays a central role. GLP-1 is a crucial anorexigenic
  peptide, with potent abilities to reduce food intake and body weight. The physiological
