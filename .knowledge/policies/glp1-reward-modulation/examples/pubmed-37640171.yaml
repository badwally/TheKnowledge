content_excerpt: Cardiovascular disease (CVD) is a leading global cause of death,
  with preventable risk factors like obesity contributing most to it. Obesity's association
  with CVD originate from factors like inflammation, insulin resistance, and altered
  lipid profiles. Obesity also raises the risk of atrial fibrillation (AF) and sudden
  cardiac death. Semaglutide, a GLP-1 receptor agonist, initially used for weight
