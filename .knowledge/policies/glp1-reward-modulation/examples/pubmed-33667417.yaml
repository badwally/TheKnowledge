content_excerpt: 'This trial assessed the efficacy and safety of the GLP-1 analogue
  once a week subcutaneous semaglutide 2·4 mg versus semaglutide 1·0 mg (the dose
  approved for diabetes treatment) and placebo for weight management in adults with
  overweight or obesity, and type 2 diabetes.


  This double-blind, double-dummy, phase 3, superiority study enrolled adults with
  a body-mass index of at least 27 kg/mand glycated haemoglobin 7-10% (53-86 mmol/mol)
  who had been diagnosed with type 2 diabetes at least 180 days'
