content_excerpt: 'OCTOBER: To explore the effects of the glucagon-like peptide 1 (GLP-1)
  liraglutide on the penile erectile function of rats with diabetic erectile dysfunction
  (DED) by observing the impact of liraglutide on the expression of eNOS in the corpus
  cavernosum of diabetic rats.


  We randomly divided 30 six-week-old male SD rats into a normal control (n = 10)
  and an experimental group (n = 20) , established models of diabetes mellitus (DM)
