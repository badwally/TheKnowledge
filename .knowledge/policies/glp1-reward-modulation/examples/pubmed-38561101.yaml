content_excerpt: Depression is a debilitating mental disease that negatively impacts
  individuals' lives and society. Novel hypotheses have been recently proposed to
  improve our understanding of depression pathogenesis. Impaired neuroplasticity and
  upregulated neuro-inflammation add-on to the disturbance in monoamine neurotransmitters
  and therefore require novel anti-depressants to target them simultaneously. Recent
  reports demonstrate the antidepressant effect of the anti-diabetic drug liraglutide.
