content_excerpt: 'The mechanistic role of glucagon-like peptide-1 (GLP-1) and GLP-1
  receptor agonists (GLP-1RAs) in modulating brain functional activity has been inadequately
  examined. Mental disorders are characterized by dysregulated functional connectivity
  in brain circuits that subserve phenomenology. We conducted a comprehensive synthesis
  of known effects of GLP-1 and GLP-1RAs on functional connectivity.


