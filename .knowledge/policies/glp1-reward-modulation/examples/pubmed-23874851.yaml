content_excerpt: Glucagon-like peptide 1 (GLP-1) is an incretine hormone that controls
  consummatory behavior and glucose homeostasis. It is released in response to nutrient
  ingestion from the intestine and production in the brain has also been identified.
  Given that GLP-1 receptors are expressed in reward areas, such as the nucleus accumbens
  and ventral tegmental area, and that common mechanisms regulate food and drug-induced
  reward we hypothesize that GLP-1 receptors are involved in reward regulation. Herein
