content_excerpt: Development of alcohol use disorders largely depends on the effects
  of alcohol on the brain reward systems. Emerging evidence indicate that common mechanisms
  regulate food and alcohol intake and raise the possibility that endocrine signals
  from the gut may play an important role for alcohol consumption, alcohol-induced
  reward and the motivation to consume alcohol. Glucagon-like peptide 1 (GLP-1), a
