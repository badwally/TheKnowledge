content_excerpt: Food intake behavior is under the tight control of the central nervous
  system. Most studies to date focus on the contribution of neurons to this behavior.
  However, although previously overlooked, astrocytes have recently been implicated
  to play a key role in feeding control. Most of the recent literature has focused
  on astrocytic contribution in the hypothalamus or the dorsal vagal complex. The
