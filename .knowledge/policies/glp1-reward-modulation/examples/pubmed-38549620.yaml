content_excerpt: Synthetic exendin-4 (EX4, exenatide), is a GLP-1 receptor agonist
  used clinically to treat glycemia in Type-2 diabetes mellitus. EX4 also promotes
  weight loss and alters food reward-seeking behaviors in part due to activation of
  GLP-1 receptors in the mesolimbic dopamine system. Evidence suggests that GLP-1
  receptor activity can directly attenuate cue-induced reward seeking. Here, we tested
