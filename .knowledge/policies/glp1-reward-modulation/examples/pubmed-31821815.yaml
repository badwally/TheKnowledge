content_excerpt: Phasic dopamine activity is evoked by reliable predictors of food
  reward and plays a role in cue-triggered, goal-directed behavior. While this important
  signal is modulated by physiological state (e.g. hunger, satiety), the mechanisms
  by which physiological state is integrated by dopamine neurons is only beginning
  to be elucidated. Activation of central receptors for glucagon-like peptide-1 (GLP-1R)
  via long-acting agonists (e.g., Exendin-4) suppresses food intake and food-directed
