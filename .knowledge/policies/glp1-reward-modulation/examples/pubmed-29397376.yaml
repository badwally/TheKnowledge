content_excerpt: 'Despite common mechanisms of actions, glucagon-like peptide-1 receptor
  agonists differ in structure, pharmacokinetic profile, and clinical effects. This
  head-to-head trial compared semaglutide with dulaglutide in patients with inadequately
  controlled type 2 diabetes.


  This was an open-label, parallel-group, phase 3b trial done at 194 hospitals, clinical
  institutions or private practices in 16 countries. Eligible patients were aged 18
