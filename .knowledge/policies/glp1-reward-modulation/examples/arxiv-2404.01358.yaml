content_excerpt: 'Adverse side effects (ASEs) of drugs, revealed after FDA approval,
  pose a threat to patient safety. To promptly detect overlooked ASEs, we developed
  a digital health methodology capable of analyzing massive public data from social
  media, published clinical research, manufacturers'' reports, and ChatGPT. We uncovered
  ASEs associated with the glucagon-like peptide 1 receptor agonists (GLP-1 RA), a
  market expected to grow exponentially to $133.5 billion USD by 2030. Using a Named
  Entity Recognition '
