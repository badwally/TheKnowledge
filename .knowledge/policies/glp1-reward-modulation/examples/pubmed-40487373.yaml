content_excerpt: 'Tirzepatide is a new molecule capable of controlling blood glucose
  levels by combining the dual agonism of glucose-dependent insulinotropic polypeptide
  (GIP) and glucose-like peptide-1 (GLP-1) receptors. The Food and Drug Administration
  approved tirzepatide subcutaneous injections as monotherapy or combination therapy,
  with diet and physical exercise. Its influence on sexual behavior as an adverse
  effect is not well known.


  The purpose of this report was to present a case study of an obese femal'
