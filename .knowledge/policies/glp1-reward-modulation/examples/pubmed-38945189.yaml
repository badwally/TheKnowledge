content_excerpt: 'The roles of metabolic signals, including Glucagon-like peptide
  1 (GLP-1), have been implicated in multiple domains outside metabolic regulation.
  There is a growing interest in repurposing Glucagon-like peptide 1 receptor agonists
  (GLP-1RAs) as therapeutics for motivation and reward-related behavioural disturbances.
  Herein, we aim to systematically review the extant evidence on the potential effects
  of GLP-1RAs on the reward system.


