content_excerpt: 'Glucagon-like peptide-1 receptor agonists (GLP-1 RAs) have emerged
  as potential therapeutic options for psychiatric symptoms due to their effects on
  mood and behavior. However, their use has been primarily for metabolic diseases,
  and limited research has evaluated their psychiatric efficacy. This systematic review
  examined the impact of GLP-1 RAs on psychiatric symptoms, categorizing studies based
  on whether psychiatric outcomes were primary or secondary.


