content_excerpt: 'The aim of this trial was to investigate the mechanism of action
  for body weight loss with semaglutide.


  This randomised, double-blind, placebo-controlled, two-period crossover trial investigated
  the effects of 12 weeks of treatment with once-weekly subcutaneous semaglutide,
  dose-escalated to 1.0 mg, in 30 subjects with obesity. Ad libitum energy intake,
