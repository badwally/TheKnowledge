content_excerpt: 'The prevalence and rising use of alcohol, opioids, and stimulants
  have led to substance use disorders (SUDs) that are a significant public health
  challenge. Traditional treatments offer some benefit; however, they often limited
  by efficacy, side effects, and accessibility, highlighting the urgent need for novel
  therapeutics. This review explores the current literature surrounding three different
  classes of novel treatments: glucagon-like peptide-1 (GLP-1) receptor agonists,
