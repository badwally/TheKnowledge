content_excerpt: 'Ozempic (semaglutide) has received widespread attention for its
  appetite-suppressing effects, leading to extensive off-label use for weight loss.
  Although gastrointestinal side effects are well documented, less is known about
  how users assess the trade-off between perceived benefits and adverse effects, or
  how these assessments influence treatment discontinuation. Importantly, existing
  insights are often limited to clinical trial populations and may not fully reflect
  real-world experiences.


