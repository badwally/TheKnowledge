content_excerpt: Food intake and appetite are regulated by various circulating hormones
  including ghrelin and glucagon-like-peptide 1 (GLP-1). Ghrelin, mainly released
  from the stomach, increases food intake, induces appetite, enhances adiposity as
  well as releases growth hormone. Hypothalamic "ghrelin receptors" (GHS-R1A) have
  a critical role in food intake regulation, but GHS-R1A are also expressed in reward
  related areas. GLP-1 is produced in the intestinal mucosa as well as in the hindbrain
