content_excerpt: 'Apoptosis is a major pathophysiological change following myocardial
  ischemia/reperfusion (I/R) injury. Glucagon-like peptide 1 (GLP-1) and its receptor
  GLP-1R are widely expressed in the cardiovascular system and GLP-1/GLP-1R activates
  the protein kinase G (PKG)-related signaling pathway. Therefore, this study tested
  whether semaglutide, a new GLP-1 analog, inhibits I/R injury-induced cardiomyocyte
  apoptosis by activating the PKG/PKCε/ERK1/2 pathway. We induced myocardial I/R injury
