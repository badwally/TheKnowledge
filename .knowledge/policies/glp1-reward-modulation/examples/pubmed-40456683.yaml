content_excerpt: 'Emerging literature indicates that simultaneously targeting glucagon-like
  peptide-1 receptors (GLP-1Rs) and neuropeptide Y receptors (Y/Y) may represent a
  new pharmacotherapeutic approach to treating opioid use disorder (OUD). The overall
  goal of this study was to screen the efficacy of GEP12, a novel GLP-1R/Yreceptor/Yreceptor
  triple agonist, to reduce voluntary fentanyl taking and seeking.


