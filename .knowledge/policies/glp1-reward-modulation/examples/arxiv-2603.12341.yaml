content_excerpt: Social media can reveal patient experiences with glucagon-like peptide-1
  receptor agonists (GLP-1 RAs) that extend beyond clinical trial data. We analyzed
  410,198 Reddit posts (May 2019-June 2025) mentioning semaglutide or tirzepatide.
  A total of 67,008 users self-reported using these medications, and 43.5% described
  at least one side effect. Gastrointestinal symptoms predominated, including nausea
  (36.9%), fatigue (16.7%), vomiting (16.3%), constipation (15.3%), and diarrhea (12.6%).
