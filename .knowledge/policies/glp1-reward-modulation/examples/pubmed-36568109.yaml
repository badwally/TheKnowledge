content_excerpt: 'The aim of this study was to evaluate changes in body weight, liver
  weight, blood glucose, liver injury markers, pro-inflammatory factors and oxidative
  stress marker levels in obese mice with HFD induced NAFLD after semaglutide use.


  The 24 C57BL6J mice were randomly divided into three groups (NCD, HFD and Sema)
  for the assessment of metabolic status, inflammatory factor and oxidative stress
  marker levels, liver histopathology in mice. Liver metabolomics was determined by
