content_excerpt: Semaglutide is a glucagon-like peptide-1 receptor agonist that was
  recently approved by the US Food and Drug Administration for chronic weight management.
  This paper reviews data on the mechanism of action, weight-loss and cardiometabolic
  efficacy, and safety of semaglutide 2.4 mg/week for obesity. Semaglutide has demonstrated
  the largest weight loss of any obesity medication to date with reductions of approximately
