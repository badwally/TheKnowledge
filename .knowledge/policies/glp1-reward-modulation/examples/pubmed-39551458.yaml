content_excerpt: 'Diabetes has been a long-known risk factor for male sexual dysfunction,
  which may be caused by persistent hyperglycemia, oxidative stress, and spermatogenesis
  inhibition. This study explored the potential of Semaglutide (Sem) to alleviate
  testicular dysfunction and spermatogenesis impairment in diabetic rats to understand
  the molecular mechanism of this protective effect.


  A controlled experiment was conducted where 28 adult male rats were divided into
  four groups: control, Semaglutide, diabetic'
