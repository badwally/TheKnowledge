content_excerpt: 'The absorption, distribution and elimination of oral semaglutide,
  the first oral glucagon-like peptide-1 receptor agonist for treating type 2 diabetes,
  was investigated using a population pharmacokinetic model based on data from clinical
  pharmacology trials.


  A previously developed, two-compartment pharmacokinetic model, based on subcutaneous
