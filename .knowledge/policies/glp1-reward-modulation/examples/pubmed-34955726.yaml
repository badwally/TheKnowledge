content_excerpt: There is a substantial need for new pharmacological treatments of
  addiction, and appetite-regulatory peptides are implied as possible candidates.
  Appetite regulation is complex and involves anorexigenic hormones such as glucagon-like
  peptide-1 (GLP-1) and amylin, and orexigenic peptides like ghrelin and all are well-known
  for their effects on feeding behaviors. This overview will summarize more recent
