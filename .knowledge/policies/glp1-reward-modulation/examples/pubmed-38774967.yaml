content_excerpt: 'The purpose of this review is to describe the existing limited data
  related to the use of semaglutide in adolescents with obesity, supplementing with
  findings from adult studies of semaglutide use.


  Semaglutide, as a once weekly subcutaneous injection for weight management, effectively
  reduces body mass index (BMI) while improving hyperglycemia, elevated alanine aminotransferase
  levels, hyperlipidemia, and quality of life in youth with obesity. As of this review,
  only one large randomized clinic'
