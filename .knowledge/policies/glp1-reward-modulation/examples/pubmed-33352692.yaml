content_excerpt: Approximately 14.4 million Americans are experiencing alcohol use
  disorder (AUD) and about two-thirds of people who experience drug addiction will
  relapse, highlighting the need to develop novel and effective treatments. Glucagon-like
  peptide-1 (GLP-1) is a peptide hormone implicated in the mesocorticolimbic reward
  system and has become a peptide of interest with respect to its putative inhibitory
  effects on drug reward. In order to further develop treatments for those diagnosed
