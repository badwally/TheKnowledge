content_excerpt: Glucagon-like peptide-1 receptor (GLP-1R) activation in the ventral
  tegmental area (VTA) is physiologically relevant for the control of palatable food
  intake. Here, we tested whether the food intake-suppressive effects of VTA GLP-1R
  activation are mediated by glutamatergic signaling within the VTA. Intra-VTA injections
  of the GLP-1R agonist exendin-4 (Ex-4) reduced palatable high-fat food intake in
  rats primarily by reducing meal size; these effects were mediated in part via glutamatergic
  AMPA/k
