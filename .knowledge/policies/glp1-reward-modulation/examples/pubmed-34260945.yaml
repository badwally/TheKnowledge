content_excerpt: The glucagon-like peptide-1 receptor (GLP-1R) regulates insulin secretion,
  carbohydrate metabolism, and appetite and is an important target for treatment of
  type 2 diabetes and obesity. Multiple GLP-1R agonists have entered into clinical
  trials, with some, such as semaglutide, progressing to approval. Others, including
  taspoglutide, failed due to the high incidence of side effects or insufficient efficacy.
  GLP-1R agonists have a broad spectrum of signaling profiles, but molecular understanding
