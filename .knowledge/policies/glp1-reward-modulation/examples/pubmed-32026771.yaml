content_excerpt: As manifestations of excessive and uncontrolled intake, obesity and
  drug addiction have generated much research aimed at identifying common neuroadaptations
  that could underlie both disorders. Much work has focused on changes in brain reward
  and motivational circuitry that can overexcite eating and drug-taking behaviors.
