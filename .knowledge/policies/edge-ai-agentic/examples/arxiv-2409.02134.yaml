content_excerpt: This work evaluates the compression techniques on ConvNeXt models
  in image classification tasks using the CIFAR-10 dataset. Structured pruning, unstructured
  pruning, and dynamic quantization methods are evaluated to reduce model size and
  computational complexity while maintaining accuracy. The experiments, conducted
  on cloud-based platforms and edge device, assess the performance of these techniques.
  Results show significant reductions in model size, with up to 75% reduction achieved
  using struc
