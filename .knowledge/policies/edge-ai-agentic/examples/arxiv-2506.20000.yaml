content_excerpt: We propose Guardian-FC, a novel two-layer framework for privacy preserving
  federated computing that unifies safety enforcement across diverse privacy preserving
  mechanisms, including cryptographic back-ends like fully homomorphic encryption
  (FHE) and multiparty computation (MPC), as well as statistical techniques such as
  differential privacy (DP). Guardian-FC decouples guard-rails from privacy mechanisms
  by executing plug-ins (modular computation units), written in a backend-neutral,
  domain-spec
