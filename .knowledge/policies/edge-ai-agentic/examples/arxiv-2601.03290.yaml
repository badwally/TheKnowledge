content_excerpt: The deployment of transformer-based models on resource-constrained
  edge devices represents a critical challenge in enabling real-time artificial intelligence
  applications. This comprehensive survey examines lightweight transformer architectures
  specifically designed for edge deployment, analyzing recent advances in model compression,
  quantization, pruning, and knowledge distillation techniques. We systematically
  review prominent lightweight variants including MobileBERT, TinyBERT, DistilBERT,
