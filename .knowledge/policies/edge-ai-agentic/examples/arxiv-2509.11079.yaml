content_excerpt: Large Language Model (LLM)-based agentic systems have shown strong
  capabilities across various tasks. However, existing multi-agent frameworks often
  rely on static or task-level workflows, which either over-process simple queries
  or underperform on complex ones, while also neglecting the efficiency-performance
  trade-offs across heterogeneous LLMs. To address these limitations, we propose Difficulty-Aware
  Agentic Orchestration (DAAO), which can dynamically generate query-specific multi-agent
