content_excerpt: Training on the Edge enables neural networks to learn continuously
  from new data after deployment on memory-constrained edge devices. Previous work
  is mostly concerned with reducing the number of model parameters which is only beneficial
  for inference. However, memory footprint from activations is the main bottleneck
  for training on the edge. Existing incremental training methods fine-tune the last
  few layers sacrificing accuracy gains from re-training the whole model. In this
