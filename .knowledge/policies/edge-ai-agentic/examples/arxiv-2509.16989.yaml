content_excerpt: Post-training quantization (PTQ) of large language models (LLMs)
  to extremely low bit-widths remains challenging due to the fundamental trade-off
  between computational efficiency and representational capacity. While existing ultra-low-bit
  methods rely on binary approximations or quantization-aware training(QAT), they
  often suffer from either limited representational capacity or huge training resource
  overhead. We introduce PTQ to Trit-Planes (PTQTP), a structured PTQ framework that
