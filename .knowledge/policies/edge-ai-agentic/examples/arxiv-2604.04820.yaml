content_excerpt: AI agents, autonomous digital actors, need agent-native protocols;
  existing methods include GUI automation and MCP-based skills, with defects of high
  token consumption, fragmented interaction, inadequate security, due to lacking a
  unified top-level framework and key components, each independent module flawed.
  To address these issues, we present ANX, an open, extensible, verifiable agent-native
  protocol and top-level framework integrating CLI, Skill, MCP, resolving pain points
  via protocol innova
