content_excerpt: Collaborative edge computing (CEC) is an emerging paradigm enabling
  sharing of the coupled data, computation, and networking resources among heterogeneous
  geo-distributed edge nodes. Recently, there has been a trend to orchestrate and
  schedule containerized application workloads in CEC, while Kubernetes has become
  the de-facto standard broadly adopted by the industry and academia. However, Kubernetes
