rationale: Introduces MQuant, a post-training quantization framework for multimodal
  LLMs addressing high inference latency and token distribution challenges. Quantization
  for reduced inference latency is a core edge optimization technique, and the work
  presents novel modality-specific static quantization with experimental results across
  five MLLMs.
