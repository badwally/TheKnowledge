content_excerpt: The increasing complexity of Intelligent Transportation Systems (ITS)
  has led to significant interest in computational offloading to external infrastructures
  such as edge servers, vehicular nodes, and UAVs. These dynamic and heterogeneous
  environments pose challenges for traditional offloading strategies, prompting the
  exploration of Reinforcement Learning (RL) and Deep Reinforcement Learning (DRL)
  as adaptive decision-making frameworks. This survey presents a comprehensive review
