content_excerpt: Decentralized Multi-agent Learning (DML) enables collaborative model
  training while preserving data privacy. However, inherent heterogeneity in agents'
  resources (computation, communication, and task size) may lead to substantial variations
  in training time. This heterogeneity creates a bottleneck, lengthening the overall
  training time due to straggler effects and potentially wasting spare resources of
  faster agents. To minimize training time in heterogeneous environments, we present
