content_excerpt: We present Gradientsys, a next-generation multi-agent scheduling
  framework that coordinates diverse specialized AI agents using a typed Model-Context
  Protocol (MCP) and a ReAct-based dynamic planning loop. At its core, Gradientsys
  employs an LLM-powered scheduler for intelligent one-to-many task dispatch, enabling
  parallel execution of heterogeneous agents such as PDF parsers, web search modules,
  GUI controllers, and web builders. The framework supports hybrid synchronous/asynchronous
  execution,
