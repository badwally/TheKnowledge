content_excerpt: 'Neural Architecture Search (NAS) has become the de-facto approach
  for designing accurate and efficient networks for edge devices. Since models are
  typically quantized for edge deployment, recent work has investigated quantization-aware
  NAS (QA-NAS) to search for highly accurate and efficient quantized models. However,
  existing QA-NAS approaches, particularly few-bit mixed-precision (FB-MP) methods,
  do not scale to larger tasks. Consequently, QA-NAS has mostly been limited to low-scale
