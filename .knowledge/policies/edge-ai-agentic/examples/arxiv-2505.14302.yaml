content_excerpt: 'Large language models (LLMs) demand substantial computational and
  memory resources, creating deployment challenges. Quantization-aware training (QAT)
  addresses these challenges by reducing model precision while maintaining performance.
  However, the scaling behavior of QAT, especially at 4-bit precision (W4A4), is not
  well understood. Existing QAT scaling laws often ignore key factors such as the
  number of training tokens and quantization granularity, which limits their applicability.
