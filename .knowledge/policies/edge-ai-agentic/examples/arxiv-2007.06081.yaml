content_excerpt: Horizontal Federated learning (FL) handles multi-client data that
  share the same set of features, and vertical FL trains a better predictor that combine
  all the features from different clients. This paper targets solving vertical FL
  in an asynchronous fashion, and develops a simple FL method. The new method allows
  each client to run stochastic gradient algorithms without coordination with other
  clients, so it is suitable for intermittent connectivity of clients. This method
