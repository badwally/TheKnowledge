content_excerpt: The convergence of edge computing and Artificial Intelligence (AI)
  gives rise to Edge-AI, which enables the deployment of real-time AI applications
  at the network edge. A key research challenge in Edge-AI is edge inference acceleration,
  which aims to realize low-latency high-accuracy Deep Neural Network (DNN) inference
  by offloading partitioned inference tasks from end devices to edge servers. However,
