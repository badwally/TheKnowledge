content_excerpt: Large Language Models (LLMs) and other foundation models are increasingly
  used as the core of AI agents. In agentic workflows, these agents plan tasks, interact
  with humans and peers, and influence scientific outcomes across federated and heterogeneous
  environments. However, agents can hallucinate or reason incorrectly, propagating
  errors when one agent's output becomes another's input. Thus, assuring that agents'
