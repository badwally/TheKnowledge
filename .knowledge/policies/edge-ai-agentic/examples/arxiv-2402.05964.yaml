content_excerpt: 'Transformer plays a vital role in the realms of natural language
  processing (NLP) and computer vision (CV), specially for constructing large language
  models (LLM) and large vision models (LVM). Model compression methods reduce the
  memory and computational cost of Transformer, which is a necessary step to implement
