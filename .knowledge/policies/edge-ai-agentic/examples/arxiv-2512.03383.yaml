content_excerpt: Deploying large language models (LLMs) on mobile platforms faces
  significant challenges due to the limited memory and shared computational resources
  of the device. Resource availability may be an issue as it is directly impacted
  by the current device workload, adding to the uncertainty of model deployment. We
  introduce UniQL, a unified post-training quantization and low-rank compression framework
