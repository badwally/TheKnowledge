content_excerpt: There has been much interest in deploying deep learning algorithms
  on low-powered devices, including smartphones, drones, and medical sensors. However,
  full-scale deep neural networks are often too resource-intensive in terms of energy
  and storage. As a result, the bulk part of the machine learning operation is therefore
  often carried out on an edge server, where the data is compressed and transmitted.
