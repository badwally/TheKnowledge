content_excerpt: Despite the growing interest in Small Language Models (SLMs) as resource-efficient
  alternatives to Large Language Models (LLMs), their deployment on edge devices remains
  challenging due to unresolved efficiency gaps in model compression. While quantization
  has proven effective for LLMs, its applicability to SLMs is significantly underexplored,
