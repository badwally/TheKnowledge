content_excerpt: 'Large language models with billions of parameters are often over-provisioned:
  many layers contribute little unique information yet dominate the memory and energy
  footprint during inference. We present LieQ Layer-wise information effectiveness
  Quantization, a hardware-native, metric-driven post-training quantization framework
  that addresses the critical challenge of maintaining accuracy in sub-8B models,
  model parameters less than 8B, under extreme low-bit compression. LieQ keeps uniform
