content_excerpt: Enterprise AI agents must continuously adapt to maintain accuracy,
  reduce latency, and remain aligned with user needs. We present a practical implementation
  of a data flywheel in NVInfo AI, NVIDIA's Mixture-of-Experts (MoE) Knowledge Assistant
  serving over 30,000 employees. By operationalizing a MAPE-driven data flywheel,
  we built a closed-loop system that systematically addresses failures in retrieval-augmented
