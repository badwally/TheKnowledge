content_excerpt: 6G networks are expected to be AI-native, intent-driven, and economically
  programmable, requiring fundamentally new approaches to network slice orchestration.
  Existing slicing frameworks, largely designed for 5G, rely on static policies and
  manual workflows and are ill-suited for the dynamic, multi-domain, and service-centric
  nature of emerging 6G environments. In this paper, we propose an agentic AI control
  plane architecture for 6G network slice orchestration, monitoring, and trading that
