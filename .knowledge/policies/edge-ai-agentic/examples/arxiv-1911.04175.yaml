content_excerpt: The capability to learn and adapt to changes in the driving environment
  is crucial for developing autonomous driving systems that are scalable beyond geo-fenced
  operational design domains. Deep Reinforcement Learning (RL) provides a promising
  and scalable framework for developing adaptive learning based solutions. Deep RL
  methods usually model the problem as a (Partially Observable) Markov Decision Process
  in which an agent acts in a stationary environment to learn an optimal behavior
  policy. Ho
