content_excerpt: Nowadays, visual intelligence tools have become ubiquitous, offering
  all kinds of convenience and possibilities. However, these tools have high computational
  requirements that exceed the capabilities of resource-constrained mobile and wearable
  devices. While offloading visual data to the cloud is a common solution, it introduces
  significant privacy vulnerabilities during transmission and server-side computation.
  To address this, we propose a novel distributed, hierarchical offloading framework
