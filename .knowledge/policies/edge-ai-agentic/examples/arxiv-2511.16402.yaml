content_excerpt: 'Even as AI capabilities improve, most enterprises do not consider
  agents trustworthy enough to work on production data. In this paper, we argue that
  the path to trustworthy agentic workflows begins with solving the infrastructure
  problem first: traditional lakehouses are not suited for agent access patterns,
  but if we design one around transactions, governance follows. In particular, we
  draw an operational analogy to MVCC in databases and show why a direct transplant
