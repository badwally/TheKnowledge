content_excerpt: Generative Artificial Intelligence (GenAI) applies models and algorithms
  such as Large Language Model (LLM) and Foundation Model (FM) to generate new data.
  GenAI, as a promising approach, enables advanced capabilities in various applications,
  including text generation and image processing. In current practice, GenAI algorithms
  run mainly on the cloud server, leading to high latency and raising security concerns.
