content_excerpt: Emerging deployments of Generative AI increasingly execute inference
  across decentralized and heterogeneous edge devices rather than on a single trusted
  server. In such environments, a single device failure or misbehavior can disrupt
  the entire inference process, making traditional best-effort peer-to-peer routing
  insufficient. Coordinating distributed generative inference therefore requires mechanisms
  that explicitly account for reliability, performance variability, and trust among
  participatin
