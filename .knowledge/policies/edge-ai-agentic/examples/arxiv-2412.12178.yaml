content_excerpt: Deploying local AI models, such as Large Language Models (LLMs),
  to edge devices can substantially enhance devices' independent capabilities, alleviate
  the server's burden, and lower the response time. Owing to these tremendous potentials,
  many big tech companies have released several lightweight Small Language Models
  (SLMs) to bridge this gap. However, we still have huge motivations to deploy more
  powerful (LLMs) AI models on edge devices and enhance their smartness level. Unlike
