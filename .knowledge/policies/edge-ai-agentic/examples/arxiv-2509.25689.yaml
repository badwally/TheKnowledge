  for scaling Large Language Models (LLMs). It increases model capacity while keeping
  computation cost low. However, the ultra-large MoE models still have hundreds of
  billions of parameters, requiring massive memory/storage and leading to difficulties
  for deployment on resource-constrained edge platforms. Pruning or quantization alone
