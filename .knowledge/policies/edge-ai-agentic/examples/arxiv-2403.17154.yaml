content_excerpt: Deciding what combination of operators to use across the Edge AI
  tiers to achieve specific latency and model performance requirements is an open
  question for MLOps engineers. This study aims to empirically assess the accuracy
  vs inference time trade-off of different black-box Edge AI deployment strategies,
  i.e., combinations of deployment operators and deployment tiers. In this paper,
  we conduct inference experiments involving 3 deployment operators (i.e., Partitioning,
  Quantization, Early Exit)
