content_excerpt: Large Language Models (LLMs) in agentic workflows combine multi-step
  reasoning, heterogeneous tool use, and collaboration across multiple specialized
  agents. Existing LLM serving engines optimize individual calls in isolation, while
  multi-agent frameworks focus on orchestration without system-level performance planning.
  As a result, repeated prompts, overlapping contexts, and fragmented CPU-GPU execution
  create substantial redundancy and poor hardware utilization, especially in batch
