content_excerpt: The increasing adoption of Artificial Intelligence (AI) has led to
  larger, more complex models with numerous parameters that require substantial computing
  power -- resources often unavailable in many real-world application scenarios. Our
  paper addresses this challenge by introducing knowledge grafting, a novel mechanism
  that optimizes AI models for resource-constrained environments by transferring selected
  features (the scion) from a large donor model to a smaller rootstock model. The
