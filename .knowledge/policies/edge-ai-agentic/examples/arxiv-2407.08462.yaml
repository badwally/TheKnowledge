content_excerpt: Federated Learning (FL) can protect the privacy of the vehicles in
  vehicle edge computing (VEC) to a certain extent through sharing the gradients of
  vehicles' local models instead of local data. The gradients of vehicles' local models
  are usually large for the vehicular artificial intelligence (AI) applications, thus
  transmitting such large gradients would cause large per-round latency. Gradient
  quantization has been proposed as one effective approach to reduce the per-round
  latency in FL enable
