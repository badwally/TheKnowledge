  ### AI Demand, Offshore Financing, & Compression Too


  “They are just flying empty airplanes around.”


  - Son


  NVIDIA is the North Star, Orion, the whole Milky Way.


  NVIDIA is benefitting from strong demand, but is selling into a concentrated set
  of buyers whose own demand is being distorted by a training and benchmarking phase
  that will not last. That distorted demand is working like a bullwhip into NVIDIA’s
  own supply chain'
