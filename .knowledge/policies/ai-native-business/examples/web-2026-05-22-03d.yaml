content_excerpt: '# Gemini 3.5 Flash Looks Good For How Fast It Is


  Google once again has a model worth at least some consideration. Gemini 3.5 Flash
  is likely the best model out there at its particular speed point, as long as you
  don’t mind that it is a Gemini model. So for cases where speed kills, this can be
  a reasonable choice. Otherwise, I don’t see signs you would want to use it over
  Opus 4.7 or GPT-5.5.


  Google also had some other offerings for I/O Day, which this post will also cover.


  #### Introducing Go'
