content_excerpt: 'I liked the idea of Jennifer Dewalt’s 180 websites in 180 days.
  However, unlike Jennifer who learned web development from scratch, I can already
  build stuff. My challenge is to actually finish and launch my projects. So for the
  next 12 months, I’ve set the goal to launch 12 startups in 12 months.


  ## Problem one: finishing


  We creatives have one common problem: finishing things. From musicians to writers
