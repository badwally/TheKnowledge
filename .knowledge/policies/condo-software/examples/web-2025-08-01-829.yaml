content_excerpt: 'JEGI LEONIS has advised Condo Control on their sale to Vertica.


  Founded in 2008 in Toronto, Ontario, Condo Control is a pioneering property management
  software solution that offers solutions for every task or problem that property
  managers, board members or owners may face.


  The acquisition will accelerate Condo Control’s growth trajectory, positioning the
  company for success amid strong market demand from property managers and owners
  for cutting edge property management solutions.

