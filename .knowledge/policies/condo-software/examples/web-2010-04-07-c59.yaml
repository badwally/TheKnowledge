rationale: NS Trustee Act is the statutory authority that NS Condominium Act s.31
  delegates reserve fund investment power to — making it the load-bearing primary
  source for Understanding that NS adopted prudent investor standard (s.3, s.3A) in
  2002 c.10 amendment. This directly corrects Finding-0027 §3 NS row which implied
  a conservative pre-2000 legal list. While general trustee law, in the NS context
  it IS the jurisdictional reserve-fund investment authority for condo corporations.
  Analogous to BC Strata Property Regulation s.6.11 which is also a general property
  regulation applied specifically to CRFs.
