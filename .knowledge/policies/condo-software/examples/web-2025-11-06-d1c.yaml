content_excerpt: '# CO-17.SP Form: Essential Tax Filing Requirement for syndicates
  of co-owners in Quebec


  Do you manage a condominium syndicate in Quebec? Wondering whether you must submit
  the CO-17.SP return each year? **In most cases, the answer is YES.**


  Under Quebec tax law, a condominium syndicate is recognized as a legal entity and
  a non-profit organization (NPO). While usually exempt from income tax, it must still
  file an annual information return with Revenu Québec. This return confirms its non-profit
