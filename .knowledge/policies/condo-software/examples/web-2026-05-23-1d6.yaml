rationale: VA DPOR/CICB Chapter 50 admin code is the primary trust-accounting regulatory
  text for VA community-association managers. Section 160 governs maintenance and
  management of accounts — the direct fiduciary trust-account requirement for VA PMs.
  This is primary regulatory authority for one of the 10 in-scope US-5 jurisdictions
  (VA) and satisfies inclusion criterion 4 (jurisdiction-specific reserve-fund and
  fiduciary regulations).
