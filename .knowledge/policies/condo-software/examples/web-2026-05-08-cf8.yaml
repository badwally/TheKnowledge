rationale: 'Buildium pricing page documents the tier structure (Essential/Growth/Premium)
  and feature-to-tier mapping for a named incumbent CAM vendor (RealPage subsidiary,
  2M+ units under management). Finding-0033 requires competitive pricing benchmarks
  for the CAM-platform landscape; this is the canonical pricing reference for Buildium,
  the dominant SMB-tier PM platform. The feature-tier mapping (Lumina AI tiers, Marketplace
  Integrations, Open API availability) establishes the per-unit pricing architecture
  for competitive gap analysis against Vantaca and Condo Control. The filter''s objection
  that it lacks HOA-specific depth is correct but insufficient to reject: pricing-tier
  structure of named incumbents is in-scope for competitive-landscape characterization
  regardless of whether the vendor leads with HOA messaging.'
