content_excerpt: '## Our Role


  ### Our role as a deposit guarantor


  The money you deposit and the interest you earn at an Alberta credit union is safe
  and secure – up to any dollar

  amount. Backed by the Government of Alberta, our guarantee is comprehensive. 100%
  of all deposits held in Alberta credit union chequing, savings and foreign currency
  accounts are guaranteed, as are registered and non-registered term deposits of any
  length.


