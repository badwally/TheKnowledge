rationale: CUDGC is the statutory AB deposit-guarantee authority under the Alberta
  Credit Union Act. Source describes 100% guarantee on all deposit types (chequing/savings/term/registered/non-registered)
  at AB credit unions, three-level protection structure, and 12 active AB credit unions.
  This is the primary citable source for AB=100% unlimited deposit coverage in Finding-0029
  §7.4. Condo reserve funds held at AB credit unions — a common practice given the
  CA prohibitive CDIC beneficiary-naming complexity — qualify as insurable deposits.
  Same apply-calibration-precedent logic as FSRA (K non-registered / unlimited registered)
  which was included at 0.3.
