rationale: 'Filter correctly identified thin vendor support content, but missed the
  load-bearing negative signal: the explicit ''Not be a strata or condominium corporation''
  eligibility exclusion is the only primary-source confirmation that Wealthsimple
  Business categorically excludes condo/strata corporations. This single exclusion
  line is structurally significant for the Canadian multi-institution sweep gap finding
  (Finding-0030 §1) — it closes off Wealthsimple as a potential Canadian analog to
  IntraFi ICS/CDARS, confirming that the white space is structural and not merely
  a product-gap. The exclusion criterion ''vendor marketing copy with no independently
  verifiable claims'' does not apply: an explicit legal-eligibility exclusion is independently
  verifiable and architecture-determinative. Corrected to include.'
