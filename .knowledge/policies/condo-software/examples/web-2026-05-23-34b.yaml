content_excerpt: '**In this article:**


  ## Overview


  The Business chequing account is an interest-earning account with no monthly fees,
  designed for incorporated businesses. It includes many of the same features as a
  personal chequing or savings account, with added functionality for business needs,
  like CRA payments.


  ## Eligibility


  To open a Wealthsimple Business account, your business must:


  - Be registered in Canada

  - Be a Canadian-controlled private corporation or a charity/association registered
