rationale: 'Filter correctly flagged thin vendor-marketing content, but missed the
  structural significance: FirstOntario''s Condominium Services page is the only named
  Canadian condo-specific banking product surfaced across the entire Wave 1.4 research
  sweep (Big 5, EQ Bank, Neo Financial, Wealthsimple, credit unions). Its existence
  — a 10-year reserve-fund investment planning tool from a Canadian credit union explicitly
  branded for condos — is itself the load-bearing fact for Finding-0030 §1 (Canadian
  banking gap) and §5 (FirstOntario profile). The filter criterion ''vendor marketing
  copy with no independently verifiable claims'' applies to sources claiming unmeasurable
  competitive advantages; here the independently verifiable claim is product existence
  in a named jurisdiction (Ontario) with a named service type (reserve fund investment
  planning, 10-year horizon, custom rates). This closes the question of whether any
  Canadian institution offers a condo-specialist product.'
