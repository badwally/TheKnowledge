rationale: 'Primary CRA interpretation bulletin IT-304R2 on Canadian condominium corporation
  tax status under s.149(1)(l) of the Income Tax Act. Load-bearing for Finding-0031
  §1: establishes the NPO exemption framework that makes reserve fund interest generally
  non-taxable for qualifying Canadian condo corporations. Paragraph 4 is the key citation.
  Archived bulletin remains authoritative as the primary CRA statement on condo NPO
  status — no superseding IT has been issued. Domain: condo-software (tax treatment
  of reserve interest, Canadian jurisdiction).'
