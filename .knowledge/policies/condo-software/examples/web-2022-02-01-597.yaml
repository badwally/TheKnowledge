content_excerpt: '## Deposit Insurance Coverage for Ontario Credit Unions and Caisses
  Populaires


  Financial Services Regulatory Authority of Ontario’s (FSRA) deposit insurance program
  protects insurable deposits held with Ontario credit unions and caisses populaires.
  Deposit insurance is part of a comprehensive depositor protection program that ensures
  the safety and soundness of credit unions and caisses populaires.


