rationale: 'TresRE launch announcement contains load-bearing structural intelligence
  for Finding-0027 §4: (1) establishes TresRE as a distinct bank-facing treasury middleware
  product (not just CINC feature), (2) names Valley Bank as launch partner, (3) documents
  Jenark and FRONTSTEPS Caliber as integration targets, (4) provides verifiable metrics
  (B annual payment volume, 14 lockbox locations, 99.74% match rate), (5) frames the
  ''swivel chair'' problem as the competitive moat narrative. Recency concern noted
  but the architectural and product-identity facts are durable — TresRE''s existence
  and structural positioning don''t expire on a 24-month cycle. CINC is the project''s
  named primary acquirer target. Override at review band per Dispatch A/B pattern
  for sources with concrete, named integration-surface specificity.'
