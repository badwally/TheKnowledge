content_excerpt: '# Deposits held in trust


  We protect eligible deposits held in trust separately from other deposits held by
  the trustee or a beneficiary in their own name at the same CDIC member institution,
  provided:


  - There is a valid trust (established with or without formal documentation) as determined
  under the laws of the province or territory in which the trust is established;

  - Required information about the trustee and the beneficiaries is disclosed on the
  records of the CDIC member institution prior '
