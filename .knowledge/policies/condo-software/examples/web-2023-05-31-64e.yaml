content_excerpt: 'Ontario’s condo management industry is calling for change as the
  province plans to build 1.5 million homes in 10 years, including a large number
  of new condos.


  The severe shortfall of licensed condo managers has been a subject of concern over
  the past few years. The condo boom coupled with the looming retirement of those
  already employed will add even more pressure to the labour drought, the Association
  of Condominium Managers of Ontario (ACMO) warned in a statement released on May
  29.


  Urbanat'
