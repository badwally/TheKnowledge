  In 2023, the Condo Authority of Ontario (CAO) surveyed condo corporations and owners
  to gain insights into the state of reserve funds in Ontario.


  Here we share key findings every condo board should know about the CAOs’ reserve
  fund report preliminary findings released in September 2024.


