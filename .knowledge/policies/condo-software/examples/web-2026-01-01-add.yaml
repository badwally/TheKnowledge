content_excerpt: '# Built in partnership with the professionals solving America''s
  infrastructure challenge


  ## The infrastructure challenge


  Half of Americans live in multi-unit properties—condos, HOAs, co-ops, and rental
  communities. The median age of these buildings is over 40 years. Deferred maintenance
  and aging infrastructure have created trillions in accumulated liabilities.


  Engineers and reserve specialists are on the front lines of this challenge, answering
  critical questions: What needs repair? How much'
