content_excerpt: 'On March 18, Fannie Mae and Freddie Mac issued a significant update
  to their project standards and property insurance requirements. These changes reflect
  the realities of today’s housing market and focus on the long-term financial sustainability
  of condominium communities based on Fannie Mae and Freddie Mac criteria, which aren’t
  always aligned with actual financial stability and performance.


