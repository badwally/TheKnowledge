rationale: 'Vantaca features page is the canonical product-surface reference for the
  dominant CAM platform (1.25B unicorn, 55K+ associations via CINC strategic context).
  Finding-0033 requires a source that grounds the feature-gap analysis: what Vantaca
  has (accounting, payments, banking integration, lockbox, AI workflows) vs. what
  it lacks (probabilistic capital planning). This page enumerates the full HOA management
  software feature set for gap-delta computation. Money-flow architecture description
  (accounting, payments, banking) directly matches inclusion criterion 4 (banking-partner
  integrations, money-flow architecture). Vendor-marketing-copy exclusion does not
  apply when the subject vendor is the primary competitive reference being characterized
  — editorial policy intent is to exclude generic vendor puff pieces, not systematic
  product characterizations of named market leaders.'
