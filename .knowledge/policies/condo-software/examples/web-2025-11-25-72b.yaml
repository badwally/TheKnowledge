rationale: 'MaintainX is explicitly cited in Finding-0034 as the best public reference
  for CMMS work-order field schema design (work-order-list API); its schema — asset_id,
  location, priority, category, assigned_to, estimated vs actual labor — defines the
  structural template Longspan needs to ingest HOA work-order data. The .5B Series
  D valuation (2025) is a load-bearing acquirer-watch signal: at this scale, MaintainX
  is a tier-1 CMMS vendor that any condo-platform acquirer (CINC, Yardi) must either
  integrate with or displace. Filtering this source on grounds of non-condo focus
  misses that the condo-software domain explicitly tracks CMMS platforms as data-source
  infrastructure for the Longspan engine, not just resident-facing products. Platform-existence
  + work-order-API-schema rationale overrides the manufacturing-framing objection.'
