rationale: CMRAO is the Ontario condominium manager regulator — a primary-source authority
  for ON Condo Act §93-95 (financial obligations), §94 (reserve fund study mandates),
  and §115 (fiduciary duties). The policy domain definition explicitly includes 'jurisdictional
  fiduciary regulation' and inclusion criterion 4 explicitly targets 'ON Condo Act
  §94' by section number. At 59 pages, this is substantive operational guidance that
  defines what financial-management software must accommodate in the Ontario market
  — exactly the regulatory constraint layer that shapes the software ecosystem. The
  filter's concern about 'software vendor analysis vs. regulatory reference' is a
  false dichotomy for this domain; regulatory requirements ARE the design constraints
  for the software.
