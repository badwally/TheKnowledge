rationale: UpKeep API docs are a P3 explicit target in Brief-0014 / Finding-0034 §9.
  The filter's 2018 date objection conflates publication date (an artifact of trafilatura's
  crawl-date inference on a continuously-updated developer portal) with content currency;
  API developer docs at developers.onupkeep.com are live infrastructure references.
  Work-order schema (asset_id, location, priority, assigned_to) is the load-bearing
  integration-surface content — directly comparable to MaintainX REST API v1 (already
  in corpus) for the CMMS ingest-path architecture comparison. The Brief-0014 nomination
  overrides the not-named-in-prior-Finding objection.
