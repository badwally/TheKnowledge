content_excerpt: '# Introduction


  Welcome to the UpKeep API! You can use our API to control and gain access to data
  such as work orders and assets.


  The UpKeep API is enabled only for accounts on the Enterprise Plan. For more information
  click here.


  # Authentication


  The UpKeep API uses session tokens to authorize API calls. Session tokens can be
  generated with the credentials of any user in your account.


  ## Log In


  ```

  curl "https://api.onupkeep.com/api/v2/auth"

  -X POST

  -d email="user@onupkeep.com"

  -d password'
