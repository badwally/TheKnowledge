content_excerpt: '## Maintaining strata buildings and assets


  Every strata owner and council member should understand the benefits of a comprehensive
  renewals program, including what work is required, when it should happen, and how
  the strata could pay for it. Ask questions, know when to seek experts, and use your
  depreciation report to help you develop a long-term plan. Learn more about depreciation
  reports.


  - For information and access to the BC Fire Code, BC Building Code, and BC Plumbing
  Code, see BC Codes 2'
