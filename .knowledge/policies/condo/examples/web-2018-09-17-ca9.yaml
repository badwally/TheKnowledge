content_excerpt: '###### 17973.


  (a) Exterior elevated elements that include load-bearing components in all buildings
  containing three or more multifamily dwelling units shall be inspected. The inspection
  shall be performed by a licensed architect; licensed civil or structural engineer;
  a building contractor holding any or all of the “A,” “B,” or “C-5” license classifications
  issued by the Contractors’ State

  License Board, with a minimum of five years’ experience, as a holder of the aforementioned
  classifications'
