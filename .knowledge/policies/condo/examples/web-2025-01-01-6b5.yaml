content_excerpt: 'Local Law 87 of 2009 as amended requires owners of certain buildings
  to undergo energy audits and retro-commissioning every ten years to identify energy-saving
  measures and ensure building systems are operating efficiently.


  An Energy Audit is a survey and analysis of energy use in a building with the purpose
  of identifying opportunities to reduce the amount of energy consumed without negatively
  affecting the operations.


