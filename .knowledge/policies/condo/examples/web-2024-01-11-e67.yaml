content_excerpt: 'By Elysa D. Bergenfeld and Nicole D. Miller


  On January 8, 2024, New Jersey’s already-stringent building codes for residential
  construction became even more so when Gov. Phil Murphy signed S2760/A4384 into law.
  The sweeping legislation establishes additional requirements for the regular inspection,
  evaluation, and maintenance of certain types of condominiums and cooperative apartments
  in the state.


