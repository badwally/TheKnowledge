content_excerpt: '# Façade Inspection & Safety Program (FISP) Filing Instructions


  Owners of buildings higher than six (6) stories **must** have exterior walls and
  appurtenances inspected every five (5) years and a technical façade report **must**
  be electronically filed with the Department through DOB NOW: *Safety*.


