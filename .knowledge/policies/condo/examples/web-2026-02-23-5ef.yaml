content_excerpt: '# ASME A17.1-2025: Safety Code for Elevators and Escalators


  The safety code for elevators and escalators, ASME A17.1-2025, or, if you’re in
  Canada, CSA B44-2025, has been revised. ASME A17.1/CSA B44-2025: Safety Code For
  Elevators And Escalators serves as a basis for the design, construction, installation,
  operation, testing, inspection, maintenance, alteration, and repair of elevators,
  dumbwaiters, escalators, moving walks, and material lifts.


