content_excerpt: '# New York City''s Facade Inspection & Safety Program (FISP)


  The Facade Inspection & Safety Program (FISP, also known as Local Law 11) is a set
  of regulations addressing the conditions of NYC’s buildings’ exterior walls and
  their appurtenances.


  FISP comprises a section of the NYC Administrative Code (Article 302 Maintenance
  of Exterior Walls), fleshed out in a rule (1 RCNY 103-04) promulgated by the DOB.


  Every five years, facades of all NYC buildings over six stories must be examined
  by a DOB-'
