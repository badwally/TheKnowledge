content_excerpt: '##### Description


  The Condominium Property Act requires that condominium corporations establish and
  maintain a capital replacement reserve fund to provide for major repairs and replacement
  of property and common property owned by the corporation. This fact sheet covers
  the responsibility and financing information for condominium boards, corporations
  and owners.


