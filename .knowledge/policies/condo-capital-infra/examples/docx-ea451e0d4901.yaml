rationale: BCFSA is the BC regulator for strata financial regulation and the primary
  authoritative source for qualified-provider rule changes. This blog post (Jan 26
  2026) is the regulator's own announcement of the Oct 27 2025 expansion of eligible
  depreciation-report providers to include professional licensees engineering (APEGBC),
  architectural technologists (AIBC), and certified technicians (ASTTBC). It closes
  the H3 date-discrepancy in Finding-0018, is the BCFSA-source cite required for any
  customer-facing BC regulatory citation chain, and is load-bearing for the can-pilot
  BC wave delivery-partner qualification screening. The filter's methodology/engine
  framing is too narrow — regulatory compliance and delivery-partner qualification
  are both explicitly in-scope per the domain policy.
