content_excerpt: '# Florida Structural Integrity Reserve Study (SIRS) 2026


  Florida''s structural integrity reserve study (SIRS) law requires condominium and
  cooperative associations with buildings three or more habitable stories to commission
  a reserve study covering eight critical structural components. The mandate stems
  from Florida Statute 718.112(2)(g), as amended by HB 913 in 2025, and works alongside
  the milestone inspection program under Section 553.899.


  This guide covers who must comply with Florida SIRS'
