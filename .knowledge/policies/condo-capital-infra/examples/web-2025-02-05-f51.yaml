rationale: 'Condo Control cross-provincial reserve fund requirements summary (ON/AB/BC)
  is a secondary regulatory triangulation source for Finding-0017 §7C and Brief-0011.
  Specifically: confirms ON Class 1/2/3 cycle, AB 5-year cycle + 12-unit DIY exception,
  BC July 1 2024 deferral elimination + 5-year cycle + six qualified-provider categories
  (P.Eng, architect, applied science technologist, AACI appraiser, CRP, quantity surveyor)
  effective July 1 2025. The BC section correctly states the July 1 2026 Metro Vancouver
  / Fraser Valley / CRD deadline and the July 1 2027 other-BC deadline — making this
  the clearest single-source qualified-provider and deadline cross-reference available
  without navigating BC regulation text. NS is not covered, which limits its utility
  for the Halifax wave, but it is the practitioner standard for the Toronto and Vancouver
  waves in Brief-0011.'
