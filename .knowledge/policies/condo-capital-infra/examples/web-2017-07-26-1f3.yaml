content_excerpt: 'The *Condominium Property Act* sets out the rules for operating
  and managing Condominiums in New Brunswick. The current Act, from 1969, will be
  replaced by a more modern Act on January 1, 2010. The new Act contains a framework
  created to protect consumers during the approval, purchase and sale process for
  Condominiums. It will be administered by the Director of Condominiums.



