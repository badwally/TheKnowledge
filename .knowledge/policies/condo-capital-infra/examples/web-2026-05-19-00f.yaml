  personal, non-commercial use. It provides easy access to property information about
  most taxable properties across British Columbia with the exception of some Indigenous
  properties, and properties with certain use codes; including recreational properties,
  such as parks and playing fields, and major industrial properties, such as pulp
  mills, and utilities.


