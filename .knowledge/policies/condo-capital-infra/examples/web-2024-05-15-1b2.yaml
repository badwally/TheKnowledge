content_excerpt: 'PayHOA, a previously bootstrapped Kentucky-based startup that offers
  software for self-managed homeowner associations (HOAs), is an example of how real-world
  problems can translate into opportunity.


  It just raised a $27.5 million Series A round in an environment where nearly $30
  million Series A rounds are no longer common.


  PayHOA founder and CEO Mike Bollinger has been putting his finance degree to good
  use. The entrepreneur started PayHOA in 2018 after selling two other companies —
  LegFi.com'
