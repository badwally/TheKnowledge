rationale: 'PayHOA is included in Finding-0025 §4.6 and the ingest plan §7 Batch 2
  specifically to establish the self-managed HOA segment as a distinct and non-competing
  category. The .5M Series A and 622K homeowners coverage confirms this is a meaningfully
  differentiated market (boards without management companies) that Longspan does not
  target. This source is required for the payhoa entity, which frames Longspan''s
  ICP exclusions. Per Finding-0025 §7 rationale: ''confirms self-managed HOA segment
  is meaningfully distinct; useful for framing Longspan ICP exclusions.'''
