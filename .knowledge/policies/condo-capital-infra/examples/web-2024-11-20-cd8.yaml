rationale: 'Vantaca is now a named Tier-2 acquirer target per Finding-0025 §7 (the
  filter policy hasn''t been updated to reflect this). The HOAi acquisition is the
  load-bearing AI capability event for Vantaca: it establishes HOAi''s 1M tasks/month
  automation throughput and voice-agent capability, which defines the AI baseline
  Longspan''s probabilistic reserve module would compete against or integrate with
  if Vantaca becomes the acquirer. Required for the Vantaca entity''s competitive
  intelligence section.'
