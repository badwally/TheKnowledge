content_excerpt: '## Governing Legislation


  **What legislation and regulations govern condominiums in Prince Edward

  Island?**


  ## Warranty Programs


  **Do provincial legislation and/or regulations require that developers of new

  condominiums provide a new home warranty to buyers?**


  No. Some developers offer their own home warranty or provide one through a third-party
  home warranty program.


  ## Taxes & Additional Costs


  **What provincial and federal taxes do condominium buyers pay on their

  units?**


  Provincial tax:'
