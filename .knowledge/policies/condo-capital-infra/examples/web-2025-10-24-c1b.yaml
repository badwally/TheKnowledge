content_excerpt: 'Douglas Elliman announced the sale of its property management arm
  to PMG Holdings, a wholly-owned subsidiary of Associa, one of the largest property
  management firms in the country.


  Associa paid $85 million for all of the equity interest in Douglas Elliman Property
  Management, according to a filing with the Securities and Exchange Commission. Elliman
  is using the proceeds from the sale, along with cash on hand, to pay off $50 million
  in convertible debt it took out from Kennedy Lewis Investment'
