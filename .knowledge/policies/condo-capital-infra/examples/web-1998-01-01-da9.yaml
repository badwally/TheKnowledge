content_excerpt: 'BuildingLink Canada was established in 2012 by Toronto based entrepreneur
  Nicholas Gill and BuildingLink LLC founders Jerry and Zach Kestenbaum. Having pioneered
  one of the first cloud based residential property management solutions in Canada
  Gill was an ideal partner for BuildingLink as they looked to build on their success
  in the U.S. market. The combination of Gill’s local market expertise and BuildingLink’s
  proven platform has been a recipe for success since inception.


