content_excerpt: 'A Vancouver-based startup is changing the way realtors and buyers
  assess condominiums and townhomes, making the process more efficient and transparent.


  Eli Report is an online tool powered by artificial intelligence (AI) that scans
  and summarizes condominium and strata documents, culling important information with
  speed and accuracy.



  **Aims to make understanding the health of a building and rules around living easy**



  “We wanted to help realtors save time on critical issues,” says Eli Report'
