rationale: 'CAO Best Practices Guide on ON reserve fund studies is the canonical practitioner
  reference for Ontario Condo Act §94 + O. Reg. 48/01 compliance. It defines the Class
  1/2/3 study schema, qualified-preparer requirements, component-inventory minimum,
  30-year funding plan structure, and notice-of-future-funding procedure — all load-bearing
  for the ON regulatory sub-section of the can-pilot extraction schema (Brief-0011
  Wave B). Distinct from the empirical CAO 2024 survey at pdf-condominium-authority-2024-report-on-resrve;
  this is the regulatory how-to guide. Secondary use: serves as the cross-province
  comparator anchor for NS and BC regulatory triangulation in Finding-0017 §7C.'
