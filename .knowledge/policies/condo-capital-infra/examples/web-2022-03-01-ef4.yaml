content_excerpt: '# Data Disclosure


  # Access to PVSC Data


  PVSC provides access to select property-related assessment information with the
  goals of increasing transparency and accountability, improving the quality of data,
  improving service to the public, and empowering citizens and supporting greater
  public engagement.


  PVSC makes data available to the public on the PVSC website and on the datazONE
  open data portal where PVSC determines that the data:


  - Is of interest or useful to the public,

