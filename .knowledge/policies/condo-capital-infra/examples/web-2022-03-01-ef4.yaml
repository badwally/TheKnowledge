rationale: 'PVSC data-disclosure policy page is operationally load-bearing for the
  can-pilot NS covariate adapter despite lacking reserve-study methodology content.
  Key signals: (1) confirms bulk-data access route runs through the Geographic Information
  Services (GIS) Division of the Office of Service Nova Scotia — not PVSC directly
  — which is the correct procurement contact for the NS covariate seed file; (2) confirms
  datazONE open-data portal as the public-facing release channel; (3) establishes
  the FOIPOP Act as the governing disclosure framework and enumerates exclusion categories
  (personal info, third-party business harms, safety). These three points collectively
  define the NS covariate access pathway that the can-pilot Halifax wave must navigate
  before bulk assessment data can be ingested. Narrow but non-substitutable for the
  Halifax implementation.'
