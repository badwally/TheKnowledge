  **What legislation and regulations govern condominiums in Newfoundland and

  Labrador?**


  ## Warranty Programs


  **Do provincial legislation and/or regulations require that developers of new

  condominiums provide a new home warranty to buyers?**


  No, but developers may offer one through a third-party home warranty program.


