rationale: 'BC Assessment property-information-trends page contains an explicit commercial-use
  prohibition notice directly cited in Finding-0017 §7B: ''Any commercial use of this
  data in whole or in part, directly or indirectly, including the use of such data
  for business, residential address or telephone directory services or any solicitation
  service is specifically prohibited.'' This is a distinct prohibition notice from
  the FAQ page (web-2026-05-19-00f) — it appears on the data-product inventory page
  that confirms bulk Data Advice commercial licensing as the only defensible route
  to province-wide BC strata covariates. The can-pilot Vancouver wave tos.py adapter
  must encode both prohibition notices. Finding-0017 §7B explicitly identifies this
  URL as the data-product inventory confirming the bulk licensing route. Filter correction
  warranted: the relevance is narrow but load-bearing for the pipeline access-rights
  decision.'
