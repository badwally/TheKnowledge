rationale: 'The Spectrum 2020 investment is the anchor event that begins the CINC
  capitalization timeline: it establishes when Spectrum joined (June 2020), what CINC''s
  scale was at that point (16K HOAs, 2M homes, 26 states), and who Ryan Davis is (appointed
  President & CEO at this announcement). These are the base-state metrics from which
  the 2023 and 2026 scale can be compared. It also announces CINC Capital (banking
  product) which is the predecessor to TresRE. Required to complete the cap-table
  history section of the cinc-systems entity per Finding-0025 §7 Batch 2.'
