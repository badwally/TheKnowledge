rationale: 'Condominium Authority of Ontario (CAO) Registry Search is the authoritative
  seed-list source for the can-pilot Ontario wave (Brief-0011 Wave C1/C2). Finding-0017
  §1.2 explicitly cites this registry as the free searchable database providing address,
  voting unit count, board director names, and management company for ~12,000 ON condo
  corporations. The ''personal purposes only'' restriction is the substantive policy
  finding — it means the can-pilot ON wave seed-list must be built via individual
  lookups or CAO data-sharing agreement rather than automated bulk scrape, exactly
  analogous to the BC Assessment commercial-use restriction. The registry URL and
  access terms are both load-bearing for tos.py adapter logic. NLM-sync gap expected:
  this is a JS-rendered SPA; trafilatura captured minimal content. Raw committed;
  wiki page needed for citation.'
