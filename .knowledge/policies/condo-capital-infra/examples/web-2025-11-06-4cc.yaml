content_excerpt: '###### Condo Registry Search


  # CAO Condo Registry


  This is a free searchable database of condo corporations in Ontario based on those
  corporation’s filings with the Condo Authority. Use this registry to find your condo’s
  address for service, number of voting units, board director names, management company
  and more. The Condo Registry can only be used for personal purposes.


