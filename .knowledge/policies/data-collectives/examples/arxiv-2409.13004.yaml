content_excerpt: 'Data poisoning and leakage risks impede the massive deployment of
  federated learning in the real world. This chapter reveals the truths and pitfalls
  of understanding two dominating threats: {\em training data privacy intrusion} and
  {\em training data poisoning}. We first investigate training data privacy threat
  and present our observations on when and how training data may be leaked during
  the course of federated training. One promising defense strategy is to perturb the
