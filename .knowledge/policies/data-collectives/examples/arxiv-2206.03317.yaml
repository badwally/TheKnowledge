content_excerpt: Privacy attacks on Machine Learning (ML) models often focus on inferring
  the existence of particular data points in the training data. However, what the
  adversary really wants to know is if a particular individual's (subject's) data
  was included during training. In such scenarios, the adversary is more likely to
  have access to the distribution of a particular subject than actual records. Furthermore,
