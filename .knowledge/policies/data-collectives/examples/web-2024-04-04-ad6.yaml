content_excerpt: '# Data cooperative


  ## Abstract


  Data cooperatives are a type of data intermediary using long established cooperative
  models and global regulatory affordances to manage data with or on behalf of members
  (data producers) for the benefit of members or for trade with external queriers
  (data users).This article belongs to the Glossary of decentralised technosocial
  systems, a special section of *Internet Policy Review*.


