content_excerpt: Recent studies have shown that the training samples can be recovered
  from gradients, which are called Gradient Inversion (GradInv) attacks. However,
  there remains a lack of extensive surveys covering recent advances and thorough
  analysis of this issue. In this paper, we present a comprehensive survey on GradInv,
  aiming to summarize the cutting-edge research and broaden the horizons for different
