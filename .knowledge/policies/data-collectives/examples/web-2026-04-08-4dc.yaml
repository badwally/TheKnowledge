content_excerpt: '# Information Blocking


  Most clinical information is digitized, accessible, and shareable thanks to several
  technology and policy advances making interoperable, electronic health record systems
  widely available. In 2016, the 21st Century Cures Act (Cures Act) made sharing electronic
  health information the expected norm in health care and authorized the Secretary
  of Health and Human Services (HHS) to identify “reasonable and necessary activities
  that do not constitute information blocking.” Infor'
