content_excerpt: '# Advancing Nationwide Interoperability with TEFCA®


  The Trusted Exchange Framework and Common Agreement™, known as TEFCA®, operates
  in the United States as a nationwide framework for health information sharing. TEFCA
  was created by the U.S. Department of Health & Human Services Office of the National
  Coordinator for Health Information Technology (ONC) to remove barriers for sharing
  health records electronically among healthcare providers, patients, public health
  agencies, and payers.


