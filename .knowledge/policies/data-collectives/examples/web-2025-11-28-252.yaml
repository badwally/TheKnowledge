content_excerpt: 'The First Nations Data Governance Strategy (FNDGS, or the * Strategy*)
  responds to a complex and evolving digital environment while providing a plausible
  incremental plan to achieve First Nations data sovereignty that is designed to ensure
  no First Nation is left behind.


  Budget 2018 provided funding to develop the * Strategy* over three years but, due
  to the strategic importance of this priority, the state of community readiness,
  and the advancement of the New Fiscal Relationship between Canada'
