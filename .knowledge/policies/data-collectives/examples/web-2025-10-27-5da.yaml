content_excerpt: 'NEW YORK, Oct. 27, 2025 (GLOBE NEWSWIRE) -- via IBN – **Datavault
  AI Inc. (Nasdaq: DVLT)**, a leader in data tokenization and management, today announced
  the creation of two groundbreaking data unions: the Insurance Data Union, partnering
  with the Independent Insurance Agents & Brokers of America (Big "I") and independent
  agents/brokers nationwide; and the Accounting Data Union, collaborating with the
  top two private accounting firms from each U.S. state developing a private equity
  index of thou'
