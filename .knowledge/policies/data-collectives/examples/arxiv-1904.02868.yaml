content_excerpt: As data becomes the fuel driving technological and economic growth,
  a fundamental challenge is how to quantify the value of data in algorithmic predictions
  and decisions. For example, in healthcare and consumer markets, it has been suggested
  that individuals should be compensated for the data that they generate, but it is
  not clear what is an equitable valuation for individual data. In this work, we develop
  a principled framework to address data valuation in the context of supervised machine
