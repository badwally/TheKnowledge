content_excerpt: '# Budget 2025: Canada''s Consumer-Driven Banking Framework


  **1. Introduction**


  Consumer-driven banking, also known as open banking, refers to a secure framework
  that lets Canadian individuals and businesses share their financial data with approved
  service providers of their choice. This framework will give consumersFootnote 1
  greater control over their data while promoting a competitive and innovative financial
  sector that strengthens Canada''s position in the global digital economy.


