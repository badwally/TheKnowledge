content_excerpt: '## About us


  MIDATA shows how data can be used for the common good, while at the same time ensuring
  the citizens’ control over their personal data.


  Founded in 2015, the nonprofit cooperative operates a data platform, acts as a trustee
  for data collection and guarantees the sovereignty of citizens over the use of their
  data.


