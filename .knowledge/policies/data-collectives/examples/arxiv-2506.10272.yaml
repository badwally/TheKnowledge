content_excerpt: This position paper argues that there is an urgent need to restructure
  markets for the information that goes into AI systems. Specifically, producers of
  information goods (such as journalists, researchers, and creative professionals)
  need to be able to collectively bargain with AI product builders in order to receive
  reasonable terms and a sustainable return on the informational value they contribute.
