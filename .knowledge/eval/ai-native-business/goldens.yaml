goldens:
- id: q01
  question: What distinguishes AI-as-substrate from AI-as-feature and AI-as-product
    in the ai-native-business framework?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - substrate means AI replaces human labor and software logic as the operational
    foundation
  - feature adds AI to an existing traditional product (e.g. Notion, Canva, Zendesk)
  - product means the offering itself is a foundation model or raw API (e.g. OpenAI,
    Anthropic)
  must_not_assert:
  - substrate-first requires building an AI product
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q02
  question: What is Surge AI's revenue-per-employee benchmark and why is it significant
    for substrate-first companies?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - approximately $1B ARR at roughly 110 employees
  - roughly $9.1M revenue per employee
  - demonstrates substrate-first organizations can decouple headcount from revenue
    growth
  must_not_assert:
  - Surge AI is an AI product company or foundation model provider
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q03
  question: What is Lovable's capital-efficiency benchmark and what does it illustrate
    about AI-native indie SaaS?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - $50M ARR with fewer than 30 employees
  - burned approximately $2M to reach the first $30M ARR
  - explicitly rejected Y Combinator to maintain lean focus
  must_not_assert:
  - Lovable raised a mega-round
  - Lovable requires traditional enterprise-scale investment
  rubric_weight:
    cite: 0.2
    assert: 0.7
    anti: 0.1

- id: q04
  question: What does a solo founder's AI agent stack cost per month, and what human
    payroll equivalent does it replace?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - $300 to $500 per month for the agent stack
  - replaces $80,000 to $120,000 per month in human payroll
  - covers functions including engineering, design, marketing, and support
  must_not_assert:
  - agent stacks cost tens of thousands of dollars per month
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q05
  question: What are the three primary archetypes in the ai-native-business domain?
  must_cite:
  - web-2025-10-04-aae
  must_assert:
  - indie SaaS or vertical agent archetype
  - services firm archetype
  - marketplace archetype
  must_not_assert:
  - foundation model or API provider is one of the three archetypes
  rubric_weight:
    cite: 0.1
    assert: 0.8
    anti: 0.1

- id: q06
  question: What is Ben Broca's Polsia achievement and which archetype does it exemplify?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - reached $1M ARR managing 1,100 client companies solo
  - exemplifies the services firm archetype at the extreme-solo end of the spectrum
  must_not_assert:
  - Polsia is a funded startup with a large team
  rubric_weight:
    cite: 0.2
    assert: 0.7
    anti: 0.1

- id: q07
  question: What is the player-coach organizational model in AI-native companies?
  must_cite:
  - web-2025-10-04-aae
  must_assert:
  - founders or leaders spend most of their time building and executing rather than
    managing
  - directors or senior operators act as individual contributors while also guiding
    the team
  must_not_assert:
  - player-coach means delegating all execution to managers
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q08
  question: What is the Pets.com dilemma for substrate-first companies and how does
    the Canva playbook address it?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - high variable inference costs against commoditized AI output compress gross margins
    to approximately 50-60%
  - the Canva playbook surrounds the AI core with low-compute high-value workflows
    to protect unit economics
  must_not_assert:
  - the Pets.com dilemma refers to hiring too many employees
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q09
  question: What do Pieter Levels' Interior AI economics demonstrate about solo AI-native
    business profitability?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - approximately $250 per month in infrastructure costs
  - against $45,000 MRR
  - greater than 99% profit margins
  must_not_assert:
  - Pieter Levels has significant infrastructure or employee costs
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q10
  question: What is context engineering in the substrate-first frame and why is it
    the primary technical competency?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - architecting information systems, retrieval pipelines, and governance rules that
    make off-the-shelf agents reliable in multi-step workflows
  - context engineering is distinct from merely writing better prompts
  must_not_assert:
  - context engineering means fine-tuning foundation models
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1

- id: q11
  question: What pricing trajectory does the ai-native-business corpus describe for
    substrate-first companies?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - shift from per-seat pricing toward usage-based or outcome-based pricing
  - Decagon charges per resolution as an exemplar of outcome-based pricing
  must_not_assert:
  - per-seat SaaS is the dominant pricing model for AI-native companies
  rubric_weight:
    cite: 0.2
    assert: 0.7
    anti: 0.1

- id: q12
  question: What is the primary technical boundary between Anysphere/Cursor and a
    pure foundation-model provider in the substrate-first taxonomy?
  must_cite:
  - web-2026-04-23-e4c
  must_assert:
  - Cursor is an application layer atop foundation models, not itself a foundation-model
    provider
  - its organizational and operating DNA is substrate-first despite shipping an AI
    product
  must_not_assert:
  - Cursor is classified as an AI-as-product company
  rubric_weight:
    cite: 0.3
    assert: 0.6
    anti: 0.1
