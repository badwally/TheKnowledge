# Retrieval golden set (WS4, 2026-06-09 RAG review).
#
# Each entry is a natural-language query and the wiki slug(s) that SHOULD
# appear in the top-k results. Queries are deliberately paraphrase-style
# (not exact title copies) so they test retrieval relevance, not string
# matching. `domain` is optional — when set, the harness scopes the search.
#
# `expect` matches by slug (page stem). A query passes recall@k if ANY
# expected slug appears in the first k hits. MRR uses the best-ranked
# expected slug.
#
# Seeded from highly-linked entities/concepts across the live corpus and
# from real question phrasings in nlm/query_plans/ and synthesis titles.

queries:
  # --- condo-software -------------------------------------------------------
  - q: "what is the Ontario law governing condominium corporations"
    domain: condo-software
    expect: [ontario-condominium-act-1998]
  - q: "British Columbia strata legislation"
    domain: condo-software
    expect: [bc-strata-property-act]
  - q: "tax form HOAs file in the US"
    domain: condo-software
    expect: [irs-form-1120-h]
  - q: "community association management platform CINC"
    domain: condo-software
    expect: [cinc-systems]
  - q: "Vantaca HOA software"
    domain: condo-software
    expect: [vantaca]
  - q: "property management software Yardi"
    domain: condo-software
    expect: [yardi]
  - q: "resident portal building communication tool"
    domain: condo-software
